*{box-sizing:border-box}

.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:12px 14px;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}

.md th{background:var(--chip)}
.md code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:12px}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 8px 8px 0}
.md li.task{list-style:none;margin-left:-18px}

.note{font-size:12px;color:var(--muted)}
#drop{position:fixed;inset:0;background:rgba(138,90,43,.15);border:4px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:20px;z-index:20}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:90vw}
.hide{display:none!important}
.toggleside{display:none}

    if(n>0){
      fur({t:"furn",x:W-0.45,y:y0,w:0.45,d:y1-y0,z:0,h:1.05,c:C.oak,top:C.terrazzo,lab:"l_win"});
      for(let i=0;i<n;i++) fur({t:"seat",shape:"cyl",x:W-0.95,y:y0+0.75*(i+0.5)-0.18,w:0.36,d:0.36,h:0.72,c:C.brass});
      L.seats.indoor+=n; frontClear=W-T-0.95;
    }
  }
  ck(frontClear>=A?"ok":"warn",`${t("c_front")} ${frontClear.toFixed(2)} m`);

  /* seating zone */
  if(Ls<2.5) ck("warn",`${t("c_seatzone")} (${Ls.toFixed(1)} m)`);
  const banqW=0.5, tblW=0.6, chW=0.45, rowW=banqW+tblW+chW+0.05;
  const nT=Math.max(0,Math.floor(Ls/pitch));
  if(nT>0 && Ls>1.2){
    fur({t:"furn",x:W-banqW,y:s0+0.1,w:banqW,d:Ls-0.2,h:0.45,c:C.rice,lab:"l_banq"});
    fur({t:"furn",x:W-0.14,y:s0+0.1,w:0.14,d:Ls-0.2,z:0.45,h:0.45,c:C.rice,p2d:0});
    // Lao textile accent cushions
    fur({t:"furn",x:W-0.24,y:s0+0.4,w:0.1,d:0.45,z:0.45,h:0.35,c:C.indigo,p2d:0});
    if(Ls>4) fur({t:"furn",x:W-0.24,y:s0+Ls-1.0,w:0.1,d:0.45,z:0.45,h:0.35,c:C.laored,p2d:0});
    const off=(Ls-0.2-nT*pitch)/2;
    for(let i=0;i<nT;i++){ const cy=s0+0.1+off+pitch*(i+0.5);
      fur({t:"furn",x:W-banqW-tblW,y:cy-0.3,w:tblW,d:0.6,h:0.75,c:C.oak,top:C.terrazzo});
      fur({t:"seat",x:W-banqW-tblW-chW-0.05,y:cy-0.2,w:chW-0.05,d:0.4,h:0.45,c:C.oak,back:1}); }
    L.seats.indoor+=2*nT;
  }
  const Fx1=W-rowW-A; // free width (bar side) in seating zone
  const cs=p.communal_table_seats, clen=cs/2*0.6+0.2;
  const cab=reuse && Fx1>=1.6;
  const cStart=s0+(cab?0.9:0.5);
  let hasL=p.lounge_seats>0 && Fx1>=1.8 && Ls>=2.6;
  let hasC=cs>0 && Fx1>=1.9 && (s1-(hasL?2.5:0.3))-cStart>=clen;
  if(cs>0 && !hasC && hasL && Fx1>=1.9 && (s1-0.3)-cStart>=clen){ hasL=false; hasC=true; ck("info",t("c_lounge_cut")); }
  if(p.lounge_seats>0 && !hasL && !L.checks.some(c=>c.msg===t("c_lounge_cut"))) ck("info",t("c_lounge_cut"));
  if(cab) fur({t:"furn",x:0,y:s0+0.1,w:1.2,d:0.45,h:1.9,c:C.wood,lab:"l_cab"});
  if(hasC){
    const cx=Math.max(0.95,Math.min(Fx1-0.95,Fx1/2));
    fur({t:"furn",x:cx-0.45,y:cStart,w:0.9,d:clen,h:0.75,c:C.oak,lab:"l_comm"});
    for(let i=0;i<cs/2;i++){ const cy=cStart+0.1+0.6*i+0.1;
      fur({t:"seat",x:cx-0.45-0.45,y:cy,w:0.4,d:0.4,h:0.45,c:C.oak,back:1});
      fur({t:"seat",x:cx+0.45+0.05,y:cy,w:0.4,d:0.4,h:0.45,c:C.oak,back:1}); }
    L.seats.indoor+=cs;
    ck(Fx1-(cx+0.9)+A>=A?"ok":"warn",`${t("c_seat")} ${(W-rowW-(cx+0.9)).toFixed(2)} m`);
  } else if(cs>0){
    if(Fx1>=1.1){ ck("info",t("c_comm_cut"));
      const n=Math.floor(((s1-(hasL?2.5:0.3))-cStart)/1.5);
      for(let i=0;i<n;i++){ const cy=cStart+1.5*i;
        fur({t:"furn",x:0,y:cy+0.45,w:0.6,d:0.6,h:0.75,c:C.oak,top:C.terrazzo});
        fur({t:"seat",x:0.1,y:cy,w:0.4,d:0.4,h:0.45,c:C.oak});
        fur({t:"seat",x:0.1,y:cy+1.1,w:0.4,d:0.4,h:0.45,c:C.oak}); }
      L.seats.indoor+=2*n;
    } else ck("info",t("c_comm_cut"));
    ck("ok",`${t("c_seat")} ${(W-rowW).toFixed(2)} m`);
  } else ck("ok",`${t("c_seat")} ${(W-rowW).toFixed(2)} m`);
  if(hasL){
    const ls=p.lounge_seats, sofa=Math.min(2,ls); let arm=Math.max(0,ls-sofa);
    arm=Math.min(arm,Math.floor((Fx1-0.2)/0.8));
    if(sofa>0) fur({t:"furn",x:0.15,y:s1-0.95,w:0.75*sofa+0.2,d:0.8,h:0.42,c:C.terra,lab:"l_lounge"});
    if(sofa>0) fur({t:"furn",x:0.15,y:s1-0.35,w:0.75*sofa+0.2,d:0.2,z:0.42,h:0.4,c:C.terra,p2d:0});
    if(sofa>0) fur({t:"furn",x:0.3,y:s1-0.55,w:0.4,d:0.12,z:0.42,h:0.3,c:C.laored,p2d:0});
    fur({t:"furn",shape:"cyl",x:0.45,y:s1-1.75,w:0.7,d:0.7,h:0.42,c:C.brass});
    for(let i=0;i<arm;i++) fur({t:"seat",x:0.15+0.8*i,y:s1-2.55,w:0.7,d:0.7,h:0.42,c:C.rice,back:1});
    L.seats.indoor+=sofa+arm;
  }

  /* back of house */
  const bxl=(x,w)=>tLocLeft?bx0+x:bx0+bw-x-w; // block-local (0 = toilet side)
  wall(bx0,s1-0.1,bw,0.1,0,H);
  const td=Math.min(2.0,B-0.9), twid=Math.min(1.6,bw*0.45);
  if(!outside){
    const tf=bxl(0,twid);
    wall(tf+(tLocLeft?0:0.9),D-td-0.1,twid-0.9,0.1,0,H); // toilet front wall, 0.9 door gap
    lab(tf+twid/2,D-td/2-0.3,"l_toilet",{small:1});
    wall(bxl(twid,0.1),D-td,0.1,td,0,H);
    put({t:"fix",x:bxl(0.2,0.45),y:D-0.7,w:0.45,d:0.65,h:0.45,c:C.white});
    put({t:"fix",x:bxl(twid-0.55,0.45),y:D-td+0.15,w:0.45,d:0.4,h:0.85,c:C.white});
    zone(bxl(0,twid),D-td,twid,td,"l_toilet","#9fb7c9");
    // corridor separation wall with staff door near aisle
    const sepW=bw-twid-0.1-0.9;
    if(sepW>0.2) wall(bxl(twid+0.1,sepW),D-td-0.1,sepW,0.1,0,H);
    const wl=Math.min(1.6,bw-twid-0.2);
    put({t:"fix",x:bxl(twid+0.1,wl),y:D-0.6,w:wl,d:0.6,h:0.9,c:C.steel,lab:"l_wash"});
    const sx=twid+0.1+wl+0.1, sw=bw-sx-0.05;
    if(sw>0.5) put({t:"fix",x:bxl(sx,sw),y:D-0.55,w:sw,d:0.55,h:1.8,c:C.oak,lab:"l_store"});
    lab(bx0+bw/2,s1+(B-td)/2,"l_corr",{small:1});
    const corr=B-td-0.1; ck(corr>=0.9?"ok":"warn",`${t("c_corr")} ${corr.toFixed(2)} m`);
    if(!tLocLeft) ck("info",t("c_drain"));
  } else {
    const wl=1.6;
    put({t:"fix",x:bxl(0.05,wl),y:D-0.6,w:wl,d:0.6,h:0.9,c:C.steel,lab:"l_wash"});
    if(bw-wl-0.3>0.5) put({t:"fix",x:bxl(wl+0.15,bw-wl-0.25),y:D-0.55,w:bw-wl-0.25,d:0.55,h:1.8,c:C.oak,lab:"l_store"});
    put({t:"fix",x:bxl(0.05,0.9),y:s1+0.05,w:0.9,d:0.45,h:1.8,c:C.oak,lab:"l_staff"});
    put({t:"wc",x:W-2.0,y:D+1.0,w:1.6,d:2.0,h:2.4,c:C.wall,lab:"l_toilet_out"});
    ck("info",t("c_outside"));
  }

  /* veranda seating */
  if(p.veranda_seating && V>=1.0){
    const side=(W-dW)/2;
    if(side>=1.1){
      const set=x0=>{ put({t:"furn",f:1,x:x0,y:V-0.5,w:Math.min(1.1,side-0.2),d:0.35,h:0.45,c:C.oak});
        put({t:"furn",f:1,shape:"cyl",x:x0+0.25,y:V-1.1,w:0.5,d:0.5,h:0.7,c:C.brass}); };
      set(0.5); set(dx+dW+0.1);
      L.seats.veranda=4; lab(W/2,0.35,"l_ver_seat",{small:1});
    }
  }

  /* garden phase 2 & condenser */
  if(G>0){
    const trees=[[W*0.28,D+2.6],[W*0.72,D+5.8],[W*0.32,D+9.4]].filter(([,y])=>y<D+G-0.8);
    trees.forEach(([x,y])=>{ put({t:"tree",shape:"cyl",x:x-0.15,y:y-0.15,w:0.3,d:0.3,h:2.4,c:C.trunk,p2d:0});
      put({t:"tree",shape:"cyl",x:x-1.4,y:y-1.4,w:2.8,d:2.8,z:2.2,h:1.3,c:C.tree,canopy:1}); });
    L.trees=trees.map(([x,y])=>[px(x),y]);
    let gs=0;
    for(let y=D+1.4;y+1.2<D+G-3.8;y+=2.2){
      put({t:"furn",f:1,ph2:1,x:0.35,y:y+0.35,w:0.6,d:0.6,h:0.75,c:C.oak});
      put({t:"seat",f:1,ph2:1,x:0.45,y:y-0.15,w:0.4,d:0.4,h:0.45,c:C.oak});
      put({t:"seat",f:1,ph2:1,x:0.45,y:y+1.05,w:0.4,d:0.4,h:0.45,c:C.oak}); gs+=2; }
    if(G>=7 && W>=4){
      const sx=W-3.4, sy=D+G-3.4;
      [[sx,sy],[sx+2.8,sy],[sx,sy+2.8],[sx+2.8,sy+2.8]].forEach(([x,y])=>put({t:"post",ph2:1,x,y,w:0.18,d:0.18,h:2.6,c:C.wood,p2d:0}));
      put({t:"sala",ph2:1,x:sx-0.3,y:sy-0.3,w:3.6,d:3.6,z:2.6,h:0.18,c:C.wood,canopy:1,lab:"l_sala"});
      put({t:"furn",f:1,ph2:1,x:sx+1.05,y:sy+0.6,w:0.9,d:1.8,h:0.75,c:C.oak});
      for(let i=0;i<3;i++){ put({t:"seat",f:1,ph2:1,x:sx+0.55,y:sy+0.7+0.6*i,w:0.4,d:0.4,h:0.45,c:C.oak}); put({t:"seat",f:1,ph2:1,x:sx+2.05,y:sy+0.7+0.6*i,w:0.4,d:0.4,h:0.45,c:C.oak}); }
      gs+=6;
    }
    L.seats.garden=gs;
    // condenser (phase 1) behind wash
    const cx0=tLocLeft?0.25:W-1.35;
    put({t:"eq",x:cx0,y:D+0.35,w:1.0,d:0.45,h:0.75,c:C.grey,lab:"l_cond"});
    put({t:"furn",x:cx0-0.1,y:D+0.9,w:1.2,d:0.05,h:1.2,c:C.wood,p2d:0});
  }

  /* MEP */
  const acY=[s0+Ls*0.3,s0+Ls*0.75];
  acY.forEach(y=>{ put({t:"ac",x:W-0.22,y:y-0.45,w:0.22,d:0.9,z:H-0.6,h:0.3,c:C.ac,p2d:0}); mep("ac",W-0.2,y); });
  [[W/2,(V+bt)/2],[W*0.45,s0+Ls/2]].forEach(([x,y])=>{ mep("fan",x,y); put({t:"fan",shape:"cyl",x:x-0.6,y:y-0.6,w:1.2,d:1.2,z:H-0.45,h:0.04,c:C.wood,ceil:1,p2d:0}); });
  for(let i=0;i<3;i++){ const y=bf+0.7+(bt-bf-1.4)*i/2; mep("light",T-0.35,y);
    put({t:"pend",shape:"cyl",x:T-0.5,y:y-0.15,w:0.3,d:0.3,z:2.05,h:0.28,c:C.glass,p2d:0});
    put({t:"pend",x:T-0.36,y:y-0.01,w:0.02,d:0.02,z:2.33,h:H-2.33,c:C.brass,p2d:0}); }
  for(let y=s0+0.8;y<s1-0.3;y+=1.8){ mep("light",W-0.1,y); put({t:"sconce",x:W-0.12,y:y-0.1,w:0.12,d:0.2,z:1.9,h:0.22,c:C.brass,p2d:0}); }
  mep("water",0.1,bf,{y2:D-0.3});
  mep("power",T-0.4,b1Y+0.35); if(b2Y>b1Y+0.8) mep("power",T-0.4,b2Y+0.35); mep("power",0.3,bt-0.6);
  mep("db",tLocLeft?bx0+bw-0.2:bx0+0.2,s1+0.25);
  if(G>0) mep("ref",W-0.15,acY[0],{to:[tLocLeft?0.75:W-0.85,D+0.55],via:[W-0.15,D-0.2]});

  /* signage */
  put({t:"sign",x:W/2-0.04,y:0.2,w:0.08,d:0.8,z:2.25,h:0.45,c:C.oak,lab:"l_sign",p2dl:1});

  /* flows */
  const doorC=W/2;
  L.flows.push({k:"f_cust",col:"#2f6fb0",pts:[[doorC,-0.6],[doorC,V+0.5],[T+0.6,posY],[T+0.6,fc1-0.3],[W-rowW-0.4,s0+Ls*0.5]].map(([x,y])=>[px(x),y])});
  L.flows.push({k:"f_take",col:"#c07a2c",pts:[[T+0.45,posY-0.1],[T+0.45,fc0+0.3],[doorC-0.3,V+0.3],[doorC-0.3,-0.6]].map(([x,y])=>[px(x),y])});
  L.flows.push({k:"f_staff",col:"#4d8a4a",pts:[[acx,D+0.6],[acx,s1-0.4],[T+0.5,bt+0.3],[T-0.35,bt-0.5],[0.9,bt-0.8]].map(([x,y])=>[px(x),y])});
  const wcx=tLocLeft?bx0+twid-0.45:bx0+bw-twid+0.45;
  if(!outside) L.flows.push({k:"f_wc",col:"#8a5ba8",pts:[[W-rowW-0.5,s0+Ls*0.6],[acx,s1+0.3],[acx,s1+(B-td)/2],[wcx,s1+(B-td)/2],[wcx,D-td+0.4]].map(([x,y])=>[px(x),y])});
  else L.flows.push({k:"f_wc",col:"#8a5ba8",pts:[[W-rowW-0.5,s0+Ls*0.6],[acx,s1+0.3],[acx,D+0.6],[px(W-1.2),D+1.0]].map(([x,y])=>[px(x),y])});

  if(Math.abs(W-6)<0.05) ck("info",t("c_width"));
  L.dimsY=[0,V,bf,bt,s1,D].concat(G>0?[D+G]:[]);
  L.area=W*(D-V); L.T=T; L.bf=bf; L.bt=bt; L.s1=s1; L.dW=dW;
  return L;
}

/* ================= 2D plan (SVG) ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let horiz=false;
function draw2D(L,p){
  const W=L.W,D=L.D,G=L.G, tot=D+(G>0?G:0);
  const box=document.getElementById("plan");
  horiz=box.clientWidth>620;
  const pad=1.3;
  // logical bbox: x [-pad-0.6, W+2.4], y [-2.4, tot+0.8]
  const lx0=-pad-0.8, lx1=W+2.6, ly0=-2.6, ly1=tot+0.9;
  // Plan data: x = from left wall (seen from the street), y = depth from the street.
  // Shown as a person standing at the street looking in: portrait = street at the bottom,
  // horizontal = street on the left with the right wall at the bottom. Both are reflections
  // of the raw (x,y) frame, so every text gets a local counter-reflection to stay readable.
  let vb, gT="";
  if(horiz){ vb=[ly0,lx0,ly1-ly0,lx1-lx0]; gT=' transform="matrix(0,1,1,0,0,0)"'; }
  else { vb=[lx0,-ly1,lx1-lx0,ly1-ly0]; gT=' transform="matrix(1,0,0,-1,0,0)"'; }
  const fs=0.26, fss=0.2;
  const T=(x,y,s,o={})=>{ const sz=o.small?fss:fs; const anchor=o.anchor||"middle";
    const fl=horiz?`matrix(0,1,1,0,${x-y},${y-x})`:`matrix(1,0,0,-1,0,${2*y})`;
    const rot=` transform="${fl}${!horiz&&o.rot?` rotate(-90 ${x} ${y})`:""}"`;
    return `<text x="${x}" y="${y}" font-size="${o.size||sz}" text-anchor="${anchor}" dominant-baseline="middle" fill="${o.fill||"#2b241d"}"${rot}${o.bold?' font-weight="700"':""}>${esc(s)}</text>`; };
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(" ")}" font-family="${getComputedStyle(document.body).fontFamily.replace(/"/g,"'")}"><defs>`;
  ["#2f6fb0","#c07a2c","#4d8a4a","#8a5ba8"].forEach((c,i)=>{ s+=`<marker id="ar${i}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`; });
  s+=`<pattern id="hatch" width="0.3" height="0.3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="0.3" stroke="#3a3026" stroke-width="0.05"/></pattern></defs><g${gT}>`;
  const ns=' vector-effect="non-scaling-stroke"';
  // street
  s+=`<rect x="${lx0}" y="-2.6" width="${lx1-lx0}" height="1.3" fill="#d8d6d2"/>`;
  s+=`<rect x="${lx0}" y="-1.3" width="${lx1-lx0}" height="1.3" fill="#e8d3c6"/>`;
  s+=T(W/2,-1.95,t("l_street"),{bold:1});
  // context
  const nbL=p.neighbour_side!=="right";
  const nbX=nbL?-0.75:W+0.15;
  s+=`<rect x="${nbX}" y="${L.V}" width="0.6" height="${D-L.V}" fill="url(#hatch)" opacity="0.5"/>`;
  s+=T(nbX+0.3,L.V+(D-L.V)/2,t("l_neigh"),{small:1,rot:1,fill:"#7a6d5f"});
  { const tx=nbL?W+1.9:-1.2; s+=`<line x1="${tx}" y1="-1" x2="${tx}" y2="${tot}" stroke="#b9ad9b" stroke-width="3"${ns} stroke-dasharray="6 4"/>`;
    s+=T(tx+(nbL?0.3:-0.3),D*0.55,t("l_temple"),{small:1,rot:1,fill:"#7a6d5f"}); }
  // garden & floors
  if(G>0) s+=`<rect x="0" y="${D}" width="${W}" height="${G}" fill="#efe2d6" stroke="#b9ad9b"${ns} stroke-dasharray="5 4"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="${L.V}" fill="#efdccf"/><rect x="0" y="${L.V}" width="${W}" height="${D-L.V}" fill="#f5ead9"/>`;
  // zones
  if(p.show_zones) L.zones.forEach(z=>{ if(z.ph2&&!p.show_phase2)return;
    s+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.d}" fill="${z.col}" opacity="0.45"/>`;
    if(z.lab!=="l_toilet"){ const a=(z.w*z.d).toFixed(1); s+=T(z.x+z.w/2,z.y+Math.min(z.d/2,0.45)+ (z.d>1.2?0:0),`${t(z.lab)} · ${a} m²`,{small:1,fill:"#4a3f33",bold:1}); } });
  // trees canopy
  (L.trees||[]).forEach(([x,y])=>{ s+=`<circle cx="${x}" cy="${y}" r="1.4" fill="${C.tree}" opacity="0.22" stroke="${C.tree}"${ns}/><circle cx="${x}" cy="${y}" r="0.15" fill="${C.trunk}"/>`; s+=T(x,y+0.4,t("l_tree"),{small:1,fill:"#3f5a2a"}); });
  // items
  L.items.forEach(it=>{
    if(it.p2d===0||it.ceil) return; if(it.ph2&&!p.show_phase2) return; if(it.f&&!p.show_furniture) return;
    const dash=it.ph2?' stroke-dasharray="4 3"':"";
    if(it.t==="wall"){ s+=`<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.d}" fill="#3a3026"/>`; return; }
    const fill=it.top||it.c, op=it.ph2?0.6:1;
    if(it.shape==="cyl") s+=`<ellipse cx="${it.x+it.w/2}" cy="${it.y+it.d/2}" rx="${it.w/2}" ry="${it.d/2}" fill="${fill}" stroke="#3a3026" stroke-width="0.8"${ns}${dash} opacity="${op}"/>`;
    else s+=`<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.d}" fill="${fill}" stroke="#3a3026" stroke-width="0.8"${ns}${dash} opacity="${op}"${it.glass?' fill-opacity="0.75"':""}/>`;

/* ================= tiny markdown renderer ================= */
function inl(s){ s=esc(s); return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,"<u>$1</u>")
  .replace(/\[ສົມມຸດ\]/g,'<span class="st-a">[ສົມມຸດ]</span>').replace(/\[ຢືນຢັນແລ້ວ\]/g,'<span class="st-ok">[ຢືນຢັນແລ້ວ]</span>').replace(/\[ຕ້ອງຂໍ\]/g,'<span class="st-q">[ຕ້ອງຂໍ]</span>'); }
function mdHtml(md){
  const lines=md.split("\n"); let h="", i=0;
  while(i<lines.length){ let l=lines[i];
    if(/^\s*<!--/.test(l)){i++;continue;}
    if(/^#{1,4} /.test(l)){ const n=l.match(/^#+/)[0].length; h+=`<h${n}>${inl(l.slice(n+1))}</h${n}>`; i++; continue; }
    if(/^---\s*$/.test(l)){ h+="<hr>"; i++; continue; }
    if(/^\|/.test(l)){ const rows=[]; while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim().replace(/\\/g,""));
      h+="<table>"; rows.forEach((r,ri)=>{ if(/^\|\s*:?-+/.test(r))return; const tag=ri===0?"th":"td"; h+="<tr>"+cells(r).map(c=>`<${tag}>${inl(c)}</${tag}>`).join("")+"</tr>"; }); h+="</table>"; continue; }
    if(/^>/.test(l)){ const q=[]; while(i<lines.length&&/^>/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++;} h+=`<blockquote>${mdHtml(q.join("\n"))}</blockquote>`; continue; }
    if(/^\s*([-*]|\d+\.) /.test(l)){ const ord=/^\s*\d+\./.test(l); h+=ord?"<ol>":"<ul>";
      while(i<lines.length&&/^\s*([-*]|\d+\.) /.test(lines[i])){ let it=lines[i].replace(/^\s*([-*]|\d+\.) /,"");
        const task=it.match(/^\[( |x)\] (.*)$/i); h+=task?`<li class="task">${task[1].trim()?"☑":"☐"} ${inl(task[2])}</li>`:`<li>${inl(it)}</li>`; i++; }
      h+=ord?"</ol>":"</ul>"; continue; }
    if(!l.trim()){i++;continue;}
    const para=[]; while(i<lines.length&&lines[i].trim()&&!/^(#|\||>|---|\s*([-*]|\d+\.) )/.test(lines[i])){para.push(lines[i]);i++;}
    h+=`<p>${inl(para.join(" "))}</p>`;
  }
  return h;
}
let BODY="";
function section(body,n){ const re=new RegExp(`^## ${n}\\.[^\\n]*\\n[\\s\\S]*?(?=^## \\d+\\.|$(?![\\s\\S]))`,"m"); const m=body.match(re); return m?m[0]:""; }
function renderMdTabs(body){
  if(body!==undefined) BODY=body;
  const note=`<p class="note">${esc(t("md_note"))}</p>`;
  document.getElementById("t_asm").innerHTML=note+mdHtml(section(BODY,3)+"\n"+section(BODY,5));
  document.getElementById("t_dec").innerHTML=note+mdHtml(section(BODY,2)+"\n"+section(BODY,4)+"\n"+section(BODY,1));
}

/* ================= controls ================= */
function fmtNum(v){ return (+v).toFixed(2).replace(/\.?0+$/,""); }
function buildControls(){
  const box=document.getElementById("ctls"); let h="", g="";
  SCHEMA.forEach(s=>{
    if(s.grp!==g){ if(g)h+="</div>"; g=s.grp; h+=`<div class="grp"><h3>${esc(t(g))}</h3>`; if(g==="g_dims") h+=`<div class="note">${esc(t("lr_note"))}</div>`; }
    const chg=String(P[s.k])!==String(BASE[s.k])?" chg":"";
    const tag=s.a?`<span class="tag">${esc(t("assume"))}</span>`:"";
    if(s.type==="bool") h+=`<label class="chk${chg}"><input type="checkbox" data-k="${s.k}" ${P[s.k]?"checked":""}> ${esc(t(s.k))}${tag}</label>`;
    else if(s.type==="sel") h+=`<div class="ctl${chg}"><label>${esc(t(s.k))}${tag}</label><select data-k="${s.k}">${s.opts.map(o=>`<option value="${o}" ${P[s.k]===o?"selected":""}>${esc(t("o_"+o))}</option>`).join("")}</select></div>`;
    else if(s.type==="text") h+=`<div class="ctl${chg}"><label>${esc(t(s.k))}</label><input type="text" data-k="${s.k}" value="${esc(P[s.k])}" maxlength="24"></div>`;
    else h+=`<div class="ctl${chg}"><label>${esc(t(s.k))}${tag}</label><span class="val">${fmtNum(P[s.k])}${s.k.endsWith("_m")?" m":""}</span><input type="range" data-k="${s.k}" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.k]}"></div>`;
  });
  h+="</div>"; box.innerHTML=h;
  box.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k, s=SK[k];
    const on=()=>{ let v=s.type==="bool"?el.checked:(s.type==="sel"||s.type==="text")?el.value:parseFloat(el.value);
      P[k]=v; if(el.type==="range"){ el.parentElement.querySelector(".val").textContent=fmtNum(v)+(k.endsWith("_m")?" m":""); }
      el.closest(".ctl,.chk").classList.toggle("chg",String(P[k])!==String(BASE[k])); renderAll(); };
    el.addEventListener(el.type==="range"||el.type==="text"?"input":"change",on);
  });
}

/* ================= render ================= */
function renderAll(){
  const L=layout(P);
  const seatArea=L.W*(L.D-L.V)-(L.T*(L.bt-L.bf))-(L.W*(L.D-L.s1));
  const st=[[L.seats.indoor,"s_indoor"],[L.seats.veranda,"s_ver"],[L.seats.garden,"s_garden"],[L.area.toFixed(1),"s_area"],[L.seats.indoor?(seatArea/L.seats.indoor).toFixed(2):"–","s_per"]];
  document.getElementById("stats").innerHTML=st.map(([v,k])=>`<div class="stat"><b>${v}</b><span>${esc(t(k))}</span></div>`).join("");
  document.getElementById("checks").innerHTML=L.checks.map(c=>`<li class="${c.cls}">${esc(c.msg)}</li>`).join("");
  draw2D(L,P); V3.L=L;
  if(!document.getElementById("t_3d").classList.contains("hide")) v3build(L,P); else V3.stale=true;
}
const TABS=[["t_plan","tab_plan"],["t_3d","tab_3d"],["t_mat","tab_mat"],["t_asm","tab_asm"],["t_dec","tab_dec"]];
let curTab="t_plan";
function buildTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(([id,k])=>`<button data-t="${id}" class="${id===curTab?"on":""}">${esc(t(k))}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
}
function showTab(id){
  curTab=id; TABS.forEach(([x])=>document.getElementById(x).classList.toggle("hide",x!==id)); buildTabs();
  if(id==="t_3d"){ if(!V3.gl&&!V3.tried){V3.tried=true; try{v3init();}catch(e){document.getElementById("v3").innerHTML=`<p class="note">${esc(t("nogl"))} (${esc(e)})</p>`;}}
    if(V3.ok){ if(!V3.viewSet){V3.viewSet=true;setView("orbit");} else v3build(layout(P),P); } }
  if(id==="t_plan") draw2D(layout(P),P);
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.getElementById("bLang").textContent=LANG==="lo"?"EN":"ລາວ";
  document.getElementById("mdsrc").textContent=MD_NAME?`${t("src_file")} ${MD_NAME} (v${MD_META.spec_version}, ${MD_META.updated})`:`${t("src_embed")} (v${MD_META.spec_version}, ${MD_META.updated})`;
  if(V3.ok) document.getElementById("v3hint").textContent=t(V3.mode==="walk"?"h_walk":"h_orbit");
  buildTabs(); buildControls(); renderAll(); renderMats(); renderMdTabs();
}

/* ================= export .md ================= */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtVal(v){ return typeof v==="number"?fmtNum(v):String(v); }
function exportMd(){
  const sp=splitMd(MD_TEXT); const changes=SCHEMA.filter(s=>String(P[s.k])!==String(BASE[s.k]));
  const ver=changes.length?(Number(MD_META.spec_version)||1)+1:(MD_META.spec_version||1);
  const d=today();
  const fm=sp.fm.split("\n").map(line=>{ const m=line.match(FM_LINE); if(!m||/^\s*#/.test(line))return line; const k=m[2];
    let v; if(k==="spec_version")v=ver; else if(k==="updated")v=changes.length?d:MD_META.updated; else if(k in P)v=fmtVal(P[k]); else return line;
    const pre=`${m[1]}${k}: ${v}`; const cm=m[4]?m[4].trimStart():""; return cm?pre.padEnd(Math.max(pre.length+1,33))+cm:pre; }).join("\n");
  // add keys missing in fm
  const have=new Set(fm.split("\n").map(l=>(l.match(FM_LINE)||[])[2]));
  const extra=SCHEMA.filter(s=>!have.has(s.k)).map(s=>`${s.k}: ${fmtVal(P[s.k])}`).join("\n");
  let body=sp.body;
  if(changes.length){
    const row=`| ${d} | v${ver} | ${t("cl_what")}: ${changes.map(s=>`\`${s.k}\` ${fmtVal(BASE[s.k])} → ${fmtVal(P[s.k])}`).join("; ")} | ${t("cl_why")} |`;
    if(/<!-- changelog-insert/.test(body)) body=body.replace(/(\n)(<!-- changelog-insert)/,`$1${row}\n$2`);
    else body+=`\n${row}\n`;
  }
  const out=`---\n${fm}${extra?"\n"+extra:""}\n---\n${body}`;
  const blob=new Blob([out],{type:"text/markdown;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="Cafe_Design_Spec.md"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(changes.length?t("saved"):t("nochange")+" · "+t("saved"));
  // the saved file becomes the new baseline
  if(changes.length){ MD_TEXT=out; MD_META.spec_version=ver; MD_META.updated=d; BASE={...P}; renderMdTabs(splitMd(out).body); buildControls(); applyLang(); }
}

/* ================= misc ================= */
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display="none",4200); }
function readFile(f){ const r=new FileReader(); r.onload=()=>{ if(loadMdText(String(r.result),f.name)){ applyLang(); toast(t("loaded")+": "+f.name); } }; r.readAsText(f,"utf-8"); }
document.getElementById("bLoad").onclick=()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange=e=>{ if(e.target.files[0]) readFile(e.target.files[0]); e.target.value=""; };
document.getElementById("bSave").onclick=exportMd;
document.getElementById("bReset").onclick=()=>{ P={...BASE}; buildControls(); renderAll(); };
document.getElementById("bLang").onclick=()=>{ LANG=LANG==="lo"?"en":"lo"; applyLang(); };
document.getElementById("bSide").onclick=()=>document.getElementById("side").classList.toggle("collapsed");
document.getElementById("vOrbit").onclick=()=>setView("orbit");
document.getElementById("vTop").onclick=()=>setView("top");
document.getElementById("vWalk").onclick=()=>setView("walk");
const drop=document.getElementById("drop"); let dragN=0;
window.addEventListener("dragenter",e=>{e.preventDefault();dragN++;drop.style.display="flex";});
window.addEventListener("dragleave",()=>{if(--dragN<=0){dragN=0;drop.style.display="none";}});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{e.preventDefault();dragN=0;drop.style.display="none";const f=e.dataTransfer.files[0];if(f)readFile(f);});
let rzT; window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{ if(curTab==="t_plan") draw2D(layout(P),P); V3.dirty=true; },150);});
if(window.matchMedia("(max-width:860px)").matches) document.getElementById("side").classList.add("collapsed");

/* boot */
if(!loadMdText(document.getElementById("specmd").textContent,null)){ MD_TEXT="---\n---\n"; BASE={...FALLBACK}; P={...FALLBACK}; }
applyLang();
window.addEventListener("load",()=>{ if(curTab==="t_plan") draw2D(layout(P),P); });
</script>
