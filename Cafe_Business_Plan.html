<style>
:root{
 --c-bg:#192b1b;--c-bg-alt:#1e3221;--c-paper:#e8e4d6;--c-paper-alt:#dedad0;
 --c-fg:#d4cfbf;--c-fg-2:rgba(212,207,191,.6);--c-fg-3:rgba(212,207,191,.32);
 --c-ink:#192b1b;--c-ink-2:rgba(25,43,27,.62);--c-ink-3:rgba(25,43,27,.36);
 --c-accent:#c8524a;--c-border:rgba(212,207,191,.14);--c-line:rgba(25,43,27,.16);
 --f-display:"Playfair Display",Georgia,serif,'Noto Sans Lao','Phetsarath OT';
 --f-body:"Jost",system-ui,sans-serif,'Noto Sans Lao','Phetsarath OT';
 --f-mono:"JetBrains Mono",monospace,'Noto Sans Lao','Phetsarath OT';
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--c-bg);color:var(--c-ink);font:300 14.5px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
span[lang="lo"],[lang="lo"]{letter-spacing:.01em}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(25,43,27,.94);border-bottom:1px solid var(--c-border)}
.bar .name{font:300 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c-fg-2)}
.bar .sp{flex:1}
.pill{display:flex;gap:2px;border:1px solid var(--c-border);border-radius:999px;padding:3px}
.pill button,.act{font:300 11px/1 var(--f-mono);letter-spacing:.12em;color:var(--c-fg-2);background:transparent;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.pill button.on{background:var(--c-accent);color:var(--c-fg)}
.act{border:1px solid var(--c-border)}
.act:hover{color:var(--c-fg)}
.page{max-width:210mm;margin:28px auto;background:var(--c-paper);box-shadow:0 2px 18px rgba(0,0,0,.35)}
.cover{background:var(--c-bg);color:var(--c-fg);padding:16mm 16mm 12mm;position:relative;overflow:hidden}
.cover .num{position:absolute;right:12mm;bottom:-.18em;font:400 150px/1 var(--f-display);color:rgba(212,207,191,.06);pointer-events:none}
.meta-line{display:flex;justify-content:space-between;gap:12px;font:300 10.5px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c-fg-2);border-bottom:1px solid var(--c-border);padding-bottom:8px}
.badge{color:var(--c-accent)}
.kicker{font:300 10.5px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c-accent)}
.rule{width:36px;height:1px;background:var(--c-accent);margin:10px 0 14px}
.cover .kicker{margin-top:22mm}
h1{font:400 34px/1.2 var(--f-display);color:var(--c-fg);max-width:85%}
.subtitle{color:var(--c-fg-2);font-size:15px;margin:10px 0 18px}
table.info{width:100%;border-collapse:collapse;position:relative}
table.info td{padding:6px 10px 6px 0;border-top:1px solid var(--c-border);vertical-align:top;font-size:13px}
table.info td:nth-child(odd){font:300 10px/1.6 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-fg-2);width:19%;padding-top:8px}
.body{padding:10mm 16mm 16mm}
section{margin-top:10mm}
section:first-child{margin-top:0}
.sec-head{border-bottom:1px solid var(--c-line);padding-bottom:6px;margin-bottom:12px;break-after:avoid}
.sec-head .kicker{margin-bottom:4px}
h2{font:400 24px/1.25 var(--f-display);color:var(--c-ink)}
h3{font:400 17px/1.35 var(--f-display);color:var(--c-ink);margin:16px 0 6px;break-after:avoid}
p{margin:6px 0 10px}
table.t{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px;line-height:1.5}
table.t th{font:300 10px/1.5 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-ink-2);text-align:left;padding:0 8px 7px 0;border-bottom:1px solid var(--c-ink-3)}
table.t td{padding:6px 8px 6px 0;border-bottom:1px solid var(--c-line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap;padding-right:0;padding-left:8px}
table.t td.c,table.t th.c{text-align:center}
table.t tr.total td{font-family:var(--f-display);font-size:14px;color:var(--c-accent);border-bottom:1px solid var(--c-ink-3);border-top:1px solid var(--c-ink-3)}
tr{break-inside:avoid}
table.kv{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px}
table.kv td{padding:7px 10px 7px 0;border-bottom:1px solid var(--c-line);vertical-align:top}
table.kv td:first-child{font:300 10px/1.6 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-ink-2);width:32%;padding-top:9px}
.callout{border-left:2px solid var(--c-ink-3);background:var(--c-paper-alt);padding:9px 14px;margin:10px 0 14px;font-size:13.5px}
.callout.warn{border-left-color:var(--c-accent)}
.callout.warn::before{content:"!";display:inline-block;font:400 15px/1 var(--f-display);color:var(--c-accent);margin-right:8px}
ul,ol{margin:6px 0 12px;padding-left:0;list-style:none}
li{display:grid;grid-template-columns:1.8em 1fr;gap:.3em;margin:4px 0}
ul>li::before{content:"—";color:var(--c-accent);font-family:var(--f-mono)}
ol{counter-reset:n}
ol>li{counter-increment:n}
ol>li::before{content:counter(n,decimal-leading-zero);color:var(--c-accent);font:300 11px/2 var(--f-mono)}
ol.own>li::before{content:none}
ol.own>li{grid-template-columns:2.4em 1fr}
ol.own b{font:300 11px/2 var(--f-mono);color:var(--c-accent)}
.sigs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.sig{flex:1;min-width:200px;border-top:1px solid var(--c-ink);padding-top:8px;margin-top:56px;font-size:13px}
.sig b{font:400 15px/1.4 var(--f-display)}
.annex{break-before:page}
.wrap{overflow-x:auto}
.foot{display:flex;justify-content:space-between;font:300 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c-ink-3);border-top:1px solid var(--c-line);margin-top:12mm;padding-top:8px}
@media (max-width:760px){.page{margin:0;box-shadow:none}.cover,.body{padding-left:16px;padding-right:16px}h1{font-size:26px}.cover .num{font-size:90px}.bar .name{display:none}}
@media print{
 @page{size:A4;margin:0}
 html,body{background:var(--c-paper)}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bar{display:none}.page{margin:0;box-shadow:none;max-width:none}
 .body{padding:10mm 16mm 14mm}.wrap{overflow:visible}
 .annex{padding-top:12mm}
}

<script id="plan-data" type="application/json">{"meta":{"type":"report","code":"LPB-CAFE-2027","kind":{"lo":"ແຜນທຸລະກິດ","en":"Business Plan"},"status":"draft","date":"2026-11-13","title":{"lo":"ແຜນທຸລະກິດ ຮ້ານກາເຟ ຖະໜົນສັກກະລິນ ຫຼວງພະບາງ","en":"Business Plan – Café, Sakkaline Road, Luang Prabang"},"subtitle":{"lo":"ຂໍ້ມູນພື້ນຖານ · ແຜນງານ · ງົບປະມານ · ກົນລະຍຸດ · ການດຳເນີນງານ","en":"Background · Business plan · Budget · Strategy · Operations"},"info":[[{"lo":"ຜູ້ລົງທຶນ","en":"Investor"},{"lo":"Ohh (ວິສາຫະກິດສ່ວນບຸກຄົນ)","en":"Ohh (sole proprietorship)"}],[{"lo":"ທີ່ຕັ້ງ","en":"Site"},{"lo":"LPB-001 ລັອກຂວາ ຖະໜົນສັກກະລິນ ຕິດວັດແສນ","en":"LPB-001 right unit, Sakkaline Rd, next to Wat Sene"}],[{"lo":"ງົບລົງທຶນ","en":"Investment budget"},{"lo":"800,000 ບາດ (ບໍ່ລວມເງິນໝູນວຽນ)","en":"THB 800,000 (excluding working capital)"}],[{"lo":"ເປົ້າໝາຍເປີດຮ້ານ","en":"Target opening"},{"lo":"ມີນາ 2027 (ເບື້ອງຕົ້ນ)","en":"March 2027 (preliminary)"}],[{"lo":"ສະເໜີຕໍ່","en":"Prepared for"},{"lo":"Ohh (ໃຊ້ພາຍໃນ)","en":"Ohh (internal use)"}]]},"sections":[{"title":{"lo":"ບົດສະຫຼຸບຫຍໍ້","en":"Executive Summary"},"numbered":false,"blocks":[{"type":"p","text":{"lo":"Ohh ຈະເປີດຮ້ານກາເຟແບລນໃໝ່ (ຊື່ຊົ່ວຄາວ \"Cafe\") ໃນເຮືອນແຖວມໍລະດົກ ລັອກຂວາ ຖະໜົນສັກກະລິນ ຕິດວັດແສນ ໃນເມືອງເກົ່າຫຼວງພະບາງ. ຮ້ານເນັ້ນເຄື່ອງດື່ມ ຂາຍນັກທ່ອງທ່ຽວເປັນຫຼັກ ຄົນທ້ອງຖິ່ນໄວໜຸ່ມເປັນອັນດັບສອງ, ເປີດ 6:30–18:00, ບໍ່ຂາຍເຫຼົ້າ, ບໍ່ມີເຮືອນຄົວ, ຂະໜົມຊື້ຈາກຜູ້ສະໜອງ ແລະ ຂາຍຖືກັບປະມານ 40% ຂອງຍອດຂາຍ.","en":"Ohh will open a new-brand café (working name \"Cafe\") in the right unit of a heritage row house on Sakkaline Road, next to Wat Sene, in Luang Prabang's old town. It is drinks-led, sells mainly to tourists and secondly to young locals, opens 6:30–18:00, serves no alcohol, has no kitchen, buys in pastries, and expects about 40% of sales as takeaway."}},{"type":"kv","rows":[[{"lo":"ງົບລົງທຶນ","en":"Investment"},{"lo":"800,000 ບາດ ຈັດສັນເຕັມ (ສຳຮອງ 61,824) + ເງິນໝູນວຽນແຍກ ແນະນຳ 250,000 ບາດ","en":"THB 800,000 fully allocated (61,824 contingency) + separate working capital, recommended THB 250,000"}],[{"lo":"ຈຸດຄຸ້ມທຶນ (ກໍລະນີຫຼັກ)","en":"Break-even (base case)"},{"lo":"~42 ລູກຄ້າ/ມື້","en":"~42 customers/day"}],[{"lo":"ກຳໄລກ່ອນອາກອນ ປີທີ 1 (ຕ່ຳ / ຫຼັກ / ດີ)","en":"Year 1 profit before tax (low / base / good)"},"394,662 / 771,515 / 1,390,868"],[{"lo":"ຄືນທຶນ (ຕ່ຳ / ຫຼັກ / ດີ)","en":"Payback (low / base / good)"},{"lo":"ເດືອນທີ 17 / 12 / 9 ຫຼັງເປີດ","en":"Month 17 / 12 / 9 after opening"}],[{"lo":"ຂໍ້ສະເໜີ","en":"Recommendation"},{"lo":"ໄປຕໍ່ ແຕ່ເຊັນສັນຍາເຊົ່າ ກໍຕໍ່ເມື່ອຜ່ານເງື່ອນໄຂ 5 ຂໍ້ໃນພາກ 7.2","en":"Proceed, but sign the lease only after the five conditions in section 7.2 are met"}]]},{"type":"callout","text":{"lo":"ຕົວເລກໃນແຜນນີ້ດີກວ່າການວິເຄາະສະຖານທີ່ (ສະບັບ 1) ຫຼາຍ ເພາະ (1) ຕົ້ນທຶນຄົງທີ່ຄິດໃໝ່ຈາກແຕ່ລະລາຍການ: ~47,500 ບາດ/ເດືອນ ແທນ 105,000 ບາດ ທີ່ຍົກມາຈາກແບລນ MELO, ແລະ (2) ລາຄາຂາຍໃຊ້ຕາມ MELO (ບິນສະເລ່ຍ 100 ບາດ ≈ 68,000 ກີບ). ລາຄາ MELO ແພງກວ່າຄູ່ແຂ່ງໃກ້ຄຽງ 40–60% ແຕ່ຈຳນວນລູກຄ້າໃນແຜນຍັງບໍ່ໄດ້ຫຼຸດລົງຕາມ — ຕ້ອງທົດສອບລາຄາຢູ່ພື້ນທີ່. ຖ້າຕົ້ນທຶນຄົງທີ່ຈິງເທົ່າ MELO, EBITDA ປີທີ 1 ກໍລະນີຫຼັກຈະເຫຼືອ ~295,681 ບາດ (ເບິ່ງ 4.5). ຕົວເລກເງິນເດືອນ ແລະ ໄຟຟ້າ ຕ້ອງຢືນຢັນກ່ອນເຊັນສັນຍາ.","en":"This plan looks much better than the site-fit analysis (v1) because (1) fixed costs were rebuilt line by line: ~THB 47,500/month instead of the THB 105,000 carried over from the MELO plan, and (2) selling prices follow MELO (average ticket THB 100 ≈ LAK 68,000). MELO prices are 40–60% above nearby competitors, yet the customer numbers have not been lowered for this — test prices on site. If real fixed costs match MELO's, base-case Year 1 EBITDA falls to ~THB 295,681 (see 4.5). Wages and electricity must be verified before signing."},"tone":"warn"},{"type":"h","level":3,"text":{"lo":"ຄວາມສ່ຽງ 3 ອັນດັບທຳອິດ","en":"Top three risks"}},{"type":"numbered","items":[{"lo":"ລູກຄ້າຕ່ຳກວ່າຈຸດຄຸ້ມທຶນ: ຍັງບໍ່ມີການນັບຄົນຍ່າງຜ່ານຈິງ.","en":"Customers below break-even: no real foot-traffic count yet."},{"lo":"ໃບອະນຸຍາດມໍລະດົກຊ້າ ຫຼື ບໍ່ຜ່ານ: ກະທົບວັນເປີດ ແລະ ຄ່າເຊົ່າທີ່ຈ່າຍໄປແລ້ວ.","en":"Heritage permit slow or refused: affects the opening date and rent already paid."},{"lo":"ການຕໍ່ລອງສັນຍາເຊົ່າບໍ່ສຳເລັດ: ເງິນລົງທຶນອາດເກີນ 800K.","en":"Lease negotiation fails: investment may exceed THB 800K."}]}]},{"title":{"lo":"ຂໍ້ມູນພື້ນຖານໂຄງການ","en":"Project Background"},"blocks":[{"type":"h","level":3,"text":{"lo":"1.1 ຜູ້ລົງທຶນ ແລະ ຮູບແບບທຸລະກິດ","en":"1.1 Investor and legal form"}},{"type":"kv","rows":[[{"lo":"ຜູ້ລົງທຶນ","en":"Investor"},{"lo":"Ohh ລົງທຶນຄົນດຽວ 100%","en":"Ohh, sole investor (100%)"}],[{"lo":"ນິຕິບຸກຄົນ","en":"Legal form"},{"lo":"ວິສາຫະກິດສ່ວນບຸກຄົນ ຊື່ Ohh (ສົມມຸດວ່າ Ohh ເປັນພົນລະເມືອງລາວ [ຕ້ອງຢືນຢັນ])","en":"Sole proprietorship in Ohh's name (assumes Ohh is a Lao citizen [to confirm])"}],[{"lo":"ແບລນ","en":"Brand"},{"lo":"ແບລນໃໝ່ຂອງ Ohh, ຊື່ຊົ່ວຄາວ \"Cafe\". MELO license ເປັນທາງເລືອກ (ພາກຜະໜວກ ກ)","en":"Ohh's new brand, working name \"Cafe\". MELO license is an option (Annex A)"}],[{"lo":"ການບໍລິຫານ","en":"Management"},{"lo":"Ohh ບໍລິຫານຈາກວຽງຈັນ ຜ່ານ dashboard, ລົງກວດເດືອນລະຄັ້ງ; ຈ້າງຜູ້ຈັດການ/ບາລິສຕ້າອາວຸໂສຢູ່ຫຼວງພະບາງ","en":"Ohh manages from Vientiane via dashboard and visits monthly; a resident manager/senior barista runs the shop"}]]},{"type":"h","level":3,"text":{"lo":"1.2 ທີ່ຕັ້ງ ແລະ ອາຄານ","en":"1.2 Site and building"}},{"type":"kv","rows":[[{"lo":"ທີ່ຢູ່","en":"Address"},{"lo":"ຖະໜົນສັກກະລິນ, ບ້ານວັດໜອງ/ຊຽງທອງ [ຕ້ອງຢືນຢັນ], ເມືອງຫຼວງພະບາງ (19.895017, 102.141195)","en":"Sakkaline Road, Ban Vat Nong/Xieng Thong [to confirm], Luang Prabang (19.895017, 102.141195)"}],[{"lo":"ພື້ນທີ່ເຊົ່າ","en":"Leased area"},{"lo":"6 × 28.5 ມ = 171 ມ²: ອາຄານເລິກ ~20 ມ (ລວມລະບຽງ) + ສວນຫຼັງ ~8.5 ມ [ຕ້ອງວັດ]","en":"6 × 28.5 m = 171 m²: building ~20 m deep (incl. veranda) + rear garden ~8.5 m [to measure]"}],[{"lo":"ອາຄານ","en":"Building"},{"lo":"ເຮືອນແຖວມໍລະດົກ 2 ຊັ້ນ; ໄລຍະ 1 ໃຊ້ຊັ້ນລຸ່ມເທົ່ານັ້ນ (ຊັ້ນເທິງບໍ່ມີຂັ້ນໄດຂອງຕົນເອງ)","en":"Two-storey heritage row house; phase 1 uses the ground floor only (upper floor has no own stair)"}],[{"lo":"ຄ່າເຊົ່າທີ່ເຈົ້າຂອງສະເໜີ","en":"Asking rent"},{"lo":"1,200 USD/ເດືອນ (14,400 USD/ປີ); ເປົ້າໝາຍຕໍ່ລອງ 1,000 USD","en":"USD 1,200/month (USD 14,400/year); negotiation target USD 1,000"}],[{"lo":"ບ່ອນນັ່ງ (ແບບແນວຄິດ v4)","en":"Seats (concept design v4)"},{"lo":"~26 ໃນອາຄານ + 4 ລະບຽງ ຫຼັງ 08:00 [ຕ້ອງຂໍ]","en":"~26 indoors + 4 on the veranda after 08:00 [needs permission]"}],[{"lo":"ຈຸດໃກ້ຄຽງ","en":"Nearby"},{"lo":"ວັດແສນ (ຕິດກຳແພງ), ວັດຊຽງທອງ 340 ມ; ເສັ້ນທາງຕັກບາດຫຼັກ","en":"Wat Sene (shared wall), Wat Xieng Thong 340 m; main alms-giving route"}]]},{"type":"h","level":3,"text":{"lo":"1.3 ຕະຫຼາດ ແລະ ລະດູທ່ອງທ່ຽວ","en":"1.3 Market and tourist seasons"}},{"type":"bullets","items":[{"lo":"ນັກທ່ອງທ່ຽວແຂວງຫຼວງພະບາງ ~2.3 ລ້ານ (2024); ມ.ກ.–ເມ.ສ. 2026 ~824,000 ຄົນ; ບຸນປີໃໝ່ 2026 ຫຼຸດ 46% ທຽບປີກ່ອນ. ໃຊ້ເປັນແນວໂນ້ມເທົ່ານັ້ນ.","en":"Luang Prabang province ~2.3 million visitors (2024); Jan–Apr 2026 ~824,000; Pi Mai 2026 down 46% year on year. Trend only."},{"lo":"ພັກສະເລ່ຍ ~3.5 ມື້; ~85% ມາທາງລົດໄຟ.","en":"Average stay ~3.5 days; ~85% arrive by train."},{"lo":"ລະດູສູງ ພ.ຈ.–ກ.ພ.; ລະດູກາງ ມີ.ນ.–ພ.ພ. ແລະ ຕ.ລ.; ລະດູຝົນ ມິ.ຖ.–ກ.ຍ.","en":"High season Nov–Feb; mid season Mar–May and Oct; rainy season Jun–Sep."},{"lo":"ບໍ່ມີຂໍ້ມູນນັບຄົນຍ່າງຜ່ານທີ່ເຜີຍແຜ່ສຳລັບຖະໜົນນີ້: ຕ້ອງນັບເອງກ່ອນເຊັນສັນຍາ.","en":"No published foot-traffic data for this street: must be counted before signing."}]},{"type":"h","level":3,"text":{"lo":"1.4 ຄູ່ແຂ່ງ","en":"1.4 Competition"}},{"type":"p","text":{"lo":"ມີຮ້ານກາເຟ/ເບເກີຣີ 3 ຮ້ານໃນ 100 ມ ແລະ 22 ຮ້ານໃນ 400 ມ, ເຊັ່ນ Scandinavian Bakery (30 ມ), Zurich Bread (40 ມ), Le Banneton (170 ມ), Joma (240 ມ), Saffron ແລະ LuLaLao (290 ມ). ລາຄາຕະຫຼາດ: Americano ~20–25K, Latte ~28–34K, Signature ~30–50K, Matcha ~45–52K ກີບ. 9 ໃນ 17 ຮ້ານໃກ້ຄຽງບໍ່ມີລາຄາອອນລາຍ.","en":"There are 3 cafés/bakeries within 100 m and 22 within 400 m, e.g. Scandinavian Bakery (30 m), Zurich Bread (40 m), Le Banneton (170 m), Joma (240 m), Saffron and LuLaLao (290 m). Market prices: Americano ~LAK 20–25K, latte ~28–34K, signature ~30–50K, matcha ~45–52K. 9 of 17 nearby shops have no prices online."}},{"type":"h","level":3,"text":{"lo":"1.5 ໃບອະນຸຍາດທີ່ຕ້ອງມີ (ຕາມລຳດັບ)","en":"1.5 Required permits (in order)"}},{"type":"table","columns":["#",{"lo":"ໃບອະນຸຍາດ","en":"Permit"},{"lo":"ເວລາ","en":"Time"},{"lo":"ໝາຍເຫດ","en":"Note"}],"rows":[["1",{"lo":"ໜັງສືບໍ່ຄັດຄ້ານ (ຝ່າຍມໍລະດົກ) + ໃບອະນຸຍາດປຸກສ້າງ","en":"Heritage no-objection + building permit"},{"lo":"ບໍ່ຮູ້ [ຕ້ອງຖາມ]","en":"Unknown [to ask]"},{"lo":"ຕ້ອງມີກ່ອນ ຈຶ່ງຂໍໃບອະນຸຍາດຮ້ານໄດ້","en":"Needed before the restaurant licence"}],["2",{"lo":"ERC + ເລກອາກອນ","en":"ERC + tax ID"},{"lo":"≤10 ວັນລັດຖະການ","en":"≤10 working days"},{"lo":"80,000–100,000 ກີບ","en":"LAK 80,000–100,000"}],["3",{"lo":"ໃບອະນຸຍາດຮ້ານອາຫານ ແລະ ດື່ມ","en":"Restaurant and drinks licence"},{"lo":"≤30 ວັນລັດຖະການ","en":"≤30 working days"},{"lo":"ທຶນ ~544 ລ້ານກີບ ໜ້າຈະຂັ້ນແຂວງ [ຕ້ອງຢືນຢັນ]; ອາຍຸ 24 ເດືອນ","en":"Investment ~LAK 544M, likely provincial level [to confirm]; valid 24 months"}],["4",{"lo":"ອະນາໄມອາຫານ, ປ້ອງກັນອັກຄີໄພ","en":"Food hygiene, fire safety"},{"lo":"ບໍ່ຮູ້","en":"Unknown"},{"lo":"ຖາມ ພະແນກສາທາລະນະສຸກ ແລະ ຕຳຫຼວດດັບເພີງ","en":"Ask health department and fire police"}]],"total_row":false,"widths":[1,6,3.5,6.5]}]},{"title":{"lo":"ແຜນງານທຸລະກິດ","en":"Business Plan"},"blocks":[{"type":"h","level":3,"text":{"lo":"2.1 ແນວຄິດຮ້ານ","en":"2.1 Concept"}},{"type":"p","text":{"lo":"ຮ້ານເຄື່ອງດື່ມທີ່ຮັບໄວ ໃນເຮືອນມໍລະດົກ: ໂຄງສ້າງເດີມ ບວກບາ ແລະ ເຟີນີເຈີທັນສະໄໝ (terrazzo ສີອ່ອນ, ໄມ້ໂອ໊ກອ່ອນ, ຜ້າທໍລາວ). ຈຸດເດັ່ນແມ່ນເຄື່ອງດື່ມຄຣີມ, ເຄື່ອງດື່ມທ້ອງຖິ່ນ (ກາເຟ ແລະ ຊາລາວ), ຈອກທີ່ຖ່າຍຮູບງາມ ແລະ ຖືຍ່າງໄປວັດຊຽງທອງໄດ້.","en":"A fast drinks café in a heritage house: original structure with a modern bar and furniture (light terrazzo, light oak, Lao textiles). Highlights: cream drinks, local drinks (Lao coffee and tea), photogenic cups, easy to carry on the walk to Wat Xieng Thong."}},{"type":"h","level":3,"text":{"lo":"2.2 ລູກຄ້າເປົ້າໝາຍ","en":"2.2 Target customers"}},{"type":"bullets","items":[{"lo":"ອັນດັບ 1: ນັກທ່ອງທ່ຽວທີ່ຍ່າງຜ່ານ ຊ່ວງເຊົ້າຫຼັງຕັກບາດ ແລະ ຊ່ວງບ່າຍ.","en":"First: tourists walking past, after the morning alms and in the afternoon."},{"lo":"ອັນດັບ 2: ຄົນທ້ອງຖິ່ນໄວໜຸ່ມ ແລະ ຄົນເຮັດວຽກໃນເມືອງເກົ່າ.","en":"Second: young locals and people working in the old town."},{"lo":"ເມນູ ແລະ ປ້າຍ 2 ພາສາ (ລາວໃຫຍ່ກວ່າ).","en":"Bilingual menu and signs (Lao larger)."}]},{"type":"h","level":3,"text":{"lo":"2.3 ເມນູ ແລະ ລາຄາ (ກີບ)","en":"2.3 Menu and prices (LAK)"}},{"type":"table","columns":[{"lo":"ກຸ່ມ","en":"Group"},{"lo":"ລາຄາ (ກີບ)","en":"Price (LAK)"},{"lo":"MELO (ບາດ)","en":"MELO (THB)"},{"lo":"ໝາຍເຫດ","en":"Note"}],"rows":[[{"lo":"ກາເຟດຳ","en":"Black coffee"},"41,000–48,000","60–70",{"lo":"Espresso, Americano, Long Black","en":"Espresso, Americano, Long Black"}],[{"lo":"ກາເຟນົມ","en":"Milk coffee"},"48,000–58,000","70–85",{"lo":"Latte, Cappuccino, Dirty","en":"Latte, Cappuccino, Dirty"}],[{"lo":"ບໍ່ແມ່ນກາເຟ","en":"Non-coffee"},"54,000–65,000","80–95",{"lo":"Matcha Latte, Matcha Cream, Chocolate","en":"Matcha Latte, Matcha Cream, Chocolate"}],[{"lo":"Signature","en":"Signature"},"65,000–78,000","95–115",{"lo":"ເຄື່ອງດື່ມຄຣີມ 3 ລາຍການ","en":"3 cream drinks"}],[{"lo":"ເຄື່ອງດື່ມທ້ອງຖິ່ນ","en":"Local drinks"},"48,000–58,000","—",{"lo":"1–2 ລາຍການ; ບໍ່ມີໃນເມນູ MELO, ຕັ້ງເທົ່າກາເຟນົມ","en":"1–2 items; not on the MELO menu, priced like milk coffee"}],[{"lo":"ຂະໜົມ (ຊື້ຈາກຜູ້ສະໜອງ)","en":"Pastries (bought in)"},"54,000–75,000","80–110",{"lo":"3–5 ລາຍການ; ບໍ່ແຂ່ງກັບເບເກີຣີໃກ້ຄຽງ","en":"3–5 items; not competing with nearby bakeries"}],[{"lo":"ຊຸດ ເຄື່ອງດື່ມ + ຂະໜົມ","en":"Drink + dessert set"},"109,000–129,000","160–190",{"lo":"ເຊັ່ນ Signature + cheesecake","en":"e.g. signature + cheesecake"}]],"total_row":false,"widths":[4.5,3.5,2.5,6.5]},{"type":"p","text":{"lo":"ເມນູນ້ອຍ ~12 ລາຍການ ໃຊ້ສ່ວນປະກອບຮ່ວມກັນ (house cream, cold brew). ລາຄາອີງຕາມ MELO (ບາດ × 680, ປັດເປັນພັນກີບ). ບິນສະເລ່ຍກໍລະນີຫຼັກ ~68,000 ກີບ (100 ບາດ ເທົ່າແບລນ MELO). ລາຄານີ້ແພງກວ່າຕະຫຼາດໃກ້ຄຽງ (Latte ~28–34K, Signature ~30–50K) — ຕ້ອງທົດສອບໃນຊ່ວງເປີດທົດລອງ ແລະ ປັບຕາມຕົ້ນທຶນສູດ.","en":"Small menu of ~12 items sharing components (house cream, cold brew). Prices follow MELO (THB × 680, rounded to LAK 1,000). Base-case average ticket ~LAK 68,000 (THB 100, as in the MELO plan). These prices are above the nearby market (latte ~28–34K, signature ~30–50K) — test them during the soft opening and adjust to recipe cost."}},{"type":"h","level":3,"text":{"lo":"2.4 ເວລາເປີດ ແລະ ການຂາຍຖືກັບ","en":"2.4 Opening hours and takeaway"}},{"type":"bullets","items":[{"lo":"ລະດູປົກກະຕິ 6:30–18:00 ທຸກມື້; ໂໝດລະດູຝົນ 7:00–17:00.","en":"Normal season 6:30–18:00 daily; rainy-season mode 7:00–17:00."},{"lo":"ຖືກັບ ~40% ຂອງຍອດຂາຍ [ສົມມຸດ, ປັບຫຼັງ 30 ມື້]; ບັນຈຸພັນ ~4 ບາດ/ຈອກ ລວມໃນຕົ້ນທຶນຜັນແປ 35%.","en":"Takeaway ~40% of sales [assumed, review after 30 days]; packaging ~THB 4/cup within the 35% variable cost."},{"lo":"ບໍ່ສົ່ງຜ່ານແອັບ; ບໍ່ຂາຍເຫຼົ້າ.","en":"No app delivery; no alcohol."}]},{"type":"h","level":3,"text":{"lo":"2.5 ຜັງຮ້ານ (ແບບແນວຄິດ v4)","en":"2.5 Layout (concept design v4)"}},{"type":"bullets","items":[{"lo":"ບາ 2 ແຖວ ຕາມຝາຂວາ (B1 classic, B2 signature), ໄລຍະ 2–6 ມ ຈາກຂອບລະບຽງ.","en":"Two-line bar along the right wall (B1 classic, B2 signature), 2–6 m from the veranda edge."},{"lo":"ບ່ອນນັ່ງ ~26: ເຄົາເຕີປ່ອງຢ້ຽມ 4, ຕັ່ງຍາວ + ໂຕະ 2 ຄົນ 12, ໂຕະກາງ 6, ໂຊຟາ 4; ລະບຽງ +4 ຫຼັງ 08:00.","en":"~26 seats: window counter 4, banquette + two-seat tables 12, communal table 6, lounge 4; veranda +4 after 08:00."},{"lo":"ສ່ວນຫຼັງຮ້ານ 3 ມ: ຫ້ອງນ້ຳເດີມ, ລ້າງ, ສາງ; ທາງໄປສວນ ≥1.2 ມ.","en":"3 m back-of-house: existing toilet, washing, storage; path to the garden ≥1.2 m."},{"lo":"ລາຍລະອຽດ: Project purpose/Cafe_Design/Cafe_Design_Concept.html","en":"Details: Project purpose/Cafe_Design/Cafe_Design_Concept.html"}]},{"type":"h","level":3,"text":{"lo":"2.6 ຄວາມອາດສາມາດ","en":"2.6 Capacity"}},{"type":"p","text":{"lo":"ກໍລະນີດີ 150 ລູກຄ້າ/ມື້ ໃນ 11.5 ຊົ່ວໂມງ, 60% ນັ່ງໃນຮ້ານ = 90 ຄົນ ຫຼື ~3 ຮອບ/ບ່ອນນັ່ງ/ມື້: ຮັບໄດ້. ບາ 2 ແຖວ ທີ່ 30–60 ວິນາທີ/ຈອກ ຮັບໄດ້ ~60–100 ຈອກ/ຊົ່ວໂມງ ໃນຊົ່ວໂມງເລັ່ງ.","en":"Good case 150 customers/day over 11.5 hours, 60% dine-in = 90 people or ~3 turns per seat per day: feasible. Two bar lines at 30–60 seconds per drink handle ~60–100 drinks/hour at peak."}}]},{"title":{"lo":"ແຜນງົບປະມານ","en":"Budget Plan"},"blocks":[{"type":"p","text":{"lo":"ງົບລົງທຶນ 800,000 ບາດ ລວມຄ່າເຊົ່າລ່ວງໜ້າ, ຕົບແຕ່ງ ແລະ ທຸກຢ່າງກ່ອນເປີດ; ບໍ່ລວມເງິນໝູນວຽນ. ຈັດສັນຕາມກໍລະນີຕໍ່ລອງສຳເລັດ: ຄ່າເຊົ່າ 1,000 USD, ຈ່າຍລ່ວງໜ້າ 3 ເດືອນ, ເຈົ້າຂອງສ້ອມພື້ນຖານ, ເຄື່ອງມືສອງ/ເຊົ່າ. ອັດຕາ: 1 USD = 22,300 ກີບ (≈ 32.79 ບາດ), 1 ບາດ = 680 ກີບ [ກວດຄືນ].","en":"The THB 800,000 budget covers prepaid rent, fit-out and everything before opening; it excludes working capital. Allocated on the negotiated case: rent USD 1,000, 3 months prepaid, owner pays basic repairs, used/leased equipment. Rates: USD 1 = LAK 22,300 (≈ THB 32.79), THB 1 = LAK 680 [recheck]."}},{"type":"h","level":3,"text":{"lo":"3.1 ສະຫຼຸບຕາມໝວດ","en":"3.1 Summary by category"}},{"type":"table","columns":[{"lo":"ໝວດ","en":"Category"},{"lo":"ບາດ","en":"THB"},"%"],"rows":[[{"lo":"ກ. ສະຖານທີ່","en":"A. Premises"},"131,176","16.4%"],[{"lo":"ຂ. ອຸປະກອນ ແລະ ຕົບແຕ່ງ","en":"B. Equipment and fit-out"},"375,000","46.9%"],[{"lo":"ຄ. ສິນຄ້າເລີ່ມຕົ້ນ","en":"C. Opening stock"},"50,000","6.2%"],[{"lo":"ງ. ແບລນ, ປ້າຍ, ອະນຸຍາດ","en":"D. Brand, signage, permits"},"70,000","8.8%"],[{"lo":"ຈ. ຄົນ ແລະ ຄວາມຮູ້","en":"E. People and know-how"},"92,000","11.5%"],[{"lo":"ສ. ການຕະຫຼາດ","en":"F. Marketing"},"20,000","2.5%"],[{"lo":"ຊ. ສຳຮອງ","en":"G. Contingency"},"61,824","7.7%"],[{"lo":"ລວມ","en":"Total"},"800,000","100%"]],"total_row":true,"widths":[10,4,3],"align":["l","r","r"]},{"type":"h","level":3,"text":{"lo":"3.2 ລາຍການລະອຽດ","en":"3.2 Line items"}},{"type":"table","columns":["#",{"lo":"ລາຍການ","en":"Item"},{"lo":"ບາດ","en":"THB"},"%"],"rows":[["1",{"lo":"ຄ່າເຊົ່າລ່ວງໜ້າ 3 ເດືອນ + ມັດຈຳ 1 ເດືອນ (1,000 USD/ເດືອນ)","en":"Rent: 3 months prepaid + 1 month deposit (USD 1,000/month)"},"131,176","16.4%"],["2",{"lo":"ອຸປະກອນ: ເຄື່ອງ espresso 2 ຫົວ, ເຄື່ອງບົດ 2, ຕູ້ເຢັນ, ເຄື່ອງເຮັດນ້ຳກ້ອນ, ເຄື່ອງປັ່ນ, ເຄື່ອງກອງນ້ຳ (ມືສອງ/ເຊົ່າ)","en":"Equipment: 2-group espresso, 2 grinders, fridges, ice maker, blender, water filter (used/leased)"},"120,000","15.0%"],["3",{"lo":"ສ້ອມພື້ນຖານ: ຫ້ອງນ້ຳ, ໄຟ, ນ້ຳ, ນ້ຳເສຍ (ເຈົ້າຂອງຈ່າຍ)","en":"Basic repairs: toilet, power, water, drainage (paid by owner)"},"0","0.0%"],["4",{"lo":"ຕົບແຕ່ງພາຍໃນ + ບາ 2 ແຖວ (ອາຄານ ~120 ມ²)","en":"Interior fit-out + two-line bar (building ~120 m²)"},"145,000","18.1%"],["5",{"lo":"ເຟີນີເຈີ ແລະ ຂອງຕົບແຕ່ງ (~30 ບ່ອນນັ່ງ, ໃຊ້ຕູ້ເກົ່າຂອງເຈົ້າຂອງ)","en":"Furniture and decor (~30 seats, reuse owner's cabinets)"},"55,000","6.9%"],["6",{"lo":"ແອ 2 ໜ່ວຍ + ພັດລົມເພດານ","en":"2 air-conditioners + ceiling fans"},"35,000","4.4%"],["7",{"lo":"ລະບົບ POS (ແທັບເລັດ, ເຄື່ອງພິມ, ລິ້ນຊັກເງິນ, wifi)","en":"POS system (tablet, printer, cash drawer, wifi)"},"20,000","2.5%"],["8",{"lo":"ບັນຈຸພັນ ແລະ ເຄື່ອງໃຊ້ນ້ອຍ (ສະຕັອກເລີ່ມຕົ້ນ, ຖືກັບ 40%)","en":"Packaging and smallwares (opening stock, 40% takeaway)"},"30,000","3.8%"],["9",{"lo":"ວັດຖຸດິບເລີ່ມຕົ້ນ (ເມັດກາເຟ, ນົມ, ຊາ, ໄຊຣັບ)","en":"Opening ingredients (beans, milk, tea, syrups)"},"20,000","2.5%"],["10",{"lo":"ຕັ້ງຊື່ ແລະ ອອກແບບແບລນ (ໂລໂກ້, ຈອກ, ແບບປ້າຍ)","en":"Brand naming and design (logo, cups, sign artwork)"},"25,000","3.1%"],["11",{"lo":"ປ້າຍຕາມລະບຽບມໍລະດົກ","en":"Signage to heritage rules"},"15,000","1.9%"],["12",{"lo":"ແບບແຕ້ມ + ໃບອະນຸຍາດ (ມໍລະດົກ, ປຸກສ້າງ, ERC, ຮ້ານອາຫານ)","en":"Drawings + permits (heritage, building, ERC, restaurant)"},"30,000","3.8%"],["13",{"lo":"ທີ່ປຶກສາ: ສູດເຄື່ອງດື່ມ, SOP, ຝຶກພະນັກງານ","en":"Consultant: drink recipes, SOP, staff training"},"60,000","7.5%"],["14",{"lo":"ເງິນເດືອນກ່ອນເປີດ (ຜູ້ຈັດການ 2 ເດືອນ, ພະນັກງານ 3 ຄົນ 1 ເດືອນ)","en":"Pre-opening wages (manager 2 months, 3 staff 1 month)"},"32,000","4.0%"],["15",{"lo":"ການຕະຫຼາດເປີດຮ້ານ","en":"Opening marketing"},"20,000","2.5%"],["16",{"lo":"ເງິນສຳຮອງ","en":"Contingency"},"61,824","7.7%"],["",{"lo":"ລວມ","en":"Total"},"800,000","100%"]],"total_row":true,"widths":[1,11,3,2],"align":["c","l","r","r"]},{"type":"callout","text":{"lo":"ລາຍການ 3 ເປັນ 0 ເພາະຂໍໃຫ້ເຈົ້າຂອງສ້ອມ (ຫຼື ຫັກຈາກຄ່າເຊົ່າ). ອຸປະກອນ, ຕົບແຕ່ງ, ເຟີນີເຈີ, ແອ, POS, ປ້າຍ ແລະ ແບລນ (415,000 ບາດ) ຄິດຄ່າເສື່ອມ 3 ປີ; ລາຍການອື່ນເປັນຄ່າໃຊ້ຈ່າຍກ່ອນເປີດ.","en":"Item 3 is zero because the owner is asked to pay (or deduct from rent). Equipment, fit-out, furniture, AC, POS, signage and brand (THB 415,000) are depreciated over 3 years; the rest are pre-opening expenses."},"tone":"info"},{"type":"h","level":3,"text":{"lo":"3.3 ກໍລະນີຕໍ່ລອງບໍ່ສຳເລັດ","en":"3.3 If negotiation fails"}},{"type":"table","columns":[{"lo":"ເງື່ອນໄຂທີ່ບໍ່ສຳເລັດ","en":"Failed condition"},{"lo":"ເງິນເພີ່ມ (ບາດ)","en":"Extra (THB)"}],"rows":[[{"lo":"ກ. ລ່ວງໜ້າ 6 + ມັດຈຳ 1 ເດືອນ ແທນ 3 + 1","en":"A. 6 months prepaid + 1 deposit instead of 3 + 1"},"98,382"],[{"lo":"ຂ. ເຈົ້າຂອງບໍ່ສ້ອມພື້ນຖານ","en":"B. Owner refuses basic repairs"},"150,000"],[{"lo":"ຄ. ຕ້ອງຊື້ອຸປະກອນໃໝ່","en":"C. Must buy new equipment"},"80,000"],[{"lo":"ງ. ຄ່າເຊົ່າ 1,200 USD ແທນ 1,000 (ລ່ວງໜ້າ 3 + 1)","en":"D. Rent USD 1,200 instead of 1,000 (3 + 1 prepaid)"},"26,235"]],"total_row":false,"widths":[12,5],"align":["l","r"]},{"type":"p","text":{"lo":"ລຳດັບຕັດເມື່ອງົບບໍ່ພໍ (ລວມ 100,000 ບາດ): (1) ເຟີນີເຈີ −20,000 ໃຊ້ຂອງເຈົ້າຂອງຫຼາຍຂຶ້ນ; (2) ຕົບແຕ່ງງ່າຍລົງ −35,000; (3) ແອ 1 ໜ່ວຍ −15,000; (4) ອອກແບບແບລນ −10,000; (5) ທີ່ປຶກສາ −20,000. ສຳຮອງໃຊ້ໄດ້ອີກ 41,824 (ເກັບຂັ້ນຕ່ຳ 20,000). ລວມຮັບເງິນເພີ່ມໄດ້ສູງສຸດ 141,824 ບາດ.","en":"Cut order if short (THB 100,000 total): (1) furniture −20,000 using more of the owner's pieces; (2) simpler fit-out −35,000; (3) one AC unit −15,000; (4) brand design −10,000; (5) consultant −20,000. Contingency adds 41,824 (keeping a 20,000 minimum). Maximum extra absorbable: THB 141,824."}},{"type":"callout","text":{"lo":"ກົດຕັດສິນ: ຖ້າເງິນເພີ່ມລວມເກີນ 141,824 ບາດ (ເຊັ່ນ ຂ ຢ່າງດຽວ, ຫຼື ກ + ຄ) ຈະເກີນ 800K → ບໍ່ເຊັນສັນຍາ. ກ, ຄ ຫຼື ງ ຢ່າງດຽວ ແລະ ກ + ງ, ຄ + ງ ຍັງຮັບໄດ້.","en":"Rule: if the extra exceeds THB 141,824 (e.g. B alone, or A + C) the total exceeds 800K → do not sign. A, C or D alone, and A + D or C + D, are still absorbable."},"tone":"warn"},{"type":"h","level":3,"text":{"lo":"3.4 ຕົ້ນທຶນຄົງທີ່ລາຍເດືອນ (ບໍ່ລວມຄ່າເຊົ່າ) [ສົມມຸດ]","en":"3.4 Monthly fixed costs (excl. rent) [assumed]"}},{"type":"table","columns":[{"lo":"ລາຍການ","en":"Item"},{"lo":"ບາດ/ເດືອນ","en":"THB/month"}],"rows":[[{"lo":"ເງິນເດືອນ 4 ຄົນ (ຜູ້ຈັດການ 6.0 ລ້ານ, ບາລິສຕ້າ 2 × 3.5 ລ້ານ, ບໍລິການ 2.5 ລ້ານ ກີບ)","en":"Wages, 4 staff (manager LAK 6.0M, 2 baristas LAK 3.5M each, service LAK 2.5M)"},"22,794"],[{"lo":"ອາຫານພະນັກງານ (25,000 ກີບ/ຄົນ/ມື້)","en":"Staff meals (LAK 25,000/person/day)"},"4,412"],[{"lo":"ປະກັນສັງຄົມ ສ່ວນນາຍຈ້າງ 6%","en":"Social security, employer share 6%"},"1,368"],[{"lo":"ໄຟຟ້າ ແລະ ນ້ຳປະປາ","en":"Electricity and water"},"6,000"],[{"lo":"ອິນເຕີເນັດ ແລະ ໂທລະສັບ","en":"Internet and phone"},"735"],[{"lo":"ຊອບແວ POS ແລະ dashboard","en":"POS and dashboard software"},"500"],[{"lo":"ຄ່າເດີນທາງ Ohh ວຽງຈັນ–ຫຼວງພະບາງ ເດືອນລະຄັ້ງ","en":"Ohh's monthly Vientiane–Luang Prabang trip"},"2,206"],[{"lo":"ທີ່ປຶກສາ (ກວດຄຸນນະພາບຄັ້ງຄາວ)","en":"Consultant (periodic quality checks)"},"2,000"],[{"lo":"ສ້ອມແປງ ແລະ ບຳລຸງຮັກສາເຄື່ອງ","en":"Repairs and equipment maintenance"},"1,500"],[{"lo":"ເຄື່ອງອະນາໄມ ແລະ ຂີ້ເຫຍື້ອ","en":"Cleaning supplies and waste"},"1,000"],[{"lo":"ນັກບັນຊີ","en":"Accountant"},"1,471"],[{"lo":"ປະກັນໄພ","en":"Insurance"},"500"],[{"lo":"ອື່ນໆ ແລະ ບໍ່ຄາດຄິດ","en":"Other and unforeseen"},"3,000"],[{"lo":"ລວມ (ລະດູປົກກະຕິ)","en":"Total (normal season)"},"47,486"],[{"lo":"ລວມ (ໂໝດລະດູຝົນ, ໄຟຟ້າຫຼຸດ 1,000)","en":"Total (rainy-season mode, power -1,000)"},"46,486"]],"total_row":false,"widths":[13,4],"align":["l","r"]},{"type":"p","text":{"lo":"ພະນັກງານ 4 ຄົນປະຈຳທັງປີ; ລະດູຝົນຫຼຸດຊົ່ວໂມງ ບໍ່ປົດພະນັກງານ. ປີທີ 1 Ohh ບໍ່ຮັບເງິນເດືອນ. ລາຍການທີ່ເປັນກີບ (ເງິນເດືອນ, ອາຫານ, ປະກັນສັງຄົມ, ອິນເຕີເນັດ 500,000, ຄ່າເດີນທາງ 1,500,000, ນັກບັນຊີ 1,000,000 ກີບ) ແປງທີ່ 1 ບາດ = 680 ກີບ.","en":"Four permanent staff all year; the rainy season cuts hours, not people. Ohh takes no salary in Year 1. Kip-based items (wages, meals, social security, internet LAK 500,000, trip LAK 1,500,000, accountant LAK 1,000,000) are converted at THB 1 = LAK 680."}},{"type":"h","level":3,"text":{"lo":"3.5 ເງິນໝູນວຽນ (ແຍກຈາກ 800K)","en":"3.5 Working capital (separate from 800K)"}},{"type":"p","text":{"lo":"ແນະນຳ 250,000 ບາດ: ປົກຄຸມເງິນສົດຕິດລົບສູງສຸດຂອງກໍລະນີຕ່ຳໃນປີທີ 1 (6,041 ບາດ) ບວກ 2 ເດືອນຂອງຕົ້ນທຶນຄົງທີ່ ແລະ ຄ່າເຊົ່າ 1,200 USD (~173,678 ບາດ), ແລະ ເຫຼືອສຳຮອງໄວ້ ຖ້າລາຄາ MELO ເຮັດໃຫ້ລູກຄ້າໜ້ອຍກວ່າຄາດ. ຕົວເລກນີ້ຕ່ຳກວ່າ 500,000 ໃນການວິເຄາະເດີມ ເພາະຕົ້ນທຶນຄົງທີ່ຄິດໃໝ່. ຖ້າຕົ້ນທຶນຄົງທີ່ຈິງສູງກວ່າ ໃຫ້ເພີ່ມເງິນໝູນວຽນ.","en":"Recommended THB 250,000: covers the low case's deepest Year 1 cash dip (THB 6,041) plus 2 months of fixed costs and rent at USD 1,200 (~THB 173,678), with headroom in case MELO prices bring fewer customers than expected. Lower than the 500,000 in the earlier analysis because fixed costs were re-estimated. Raise it if real fixed costs are higher."}}]},{"title":{"lo":"ການຄາດຄະເນການເງິນ 3 ປີ","en":"Three-Year Financial Projection"},"blocks":[{"type":"h","level":3,"text":{"lo":"4.1 ສົມມຸດຖານ","en":"4.1 Assumptions"}},{"type":"bullets","items":[{"lo":"ປີທີ 1 = ມີ.ນ. 2027 – ກ.ພ. 2028; ເດືອນທີ 0 = ໄລຍະກ່ອນເປີດ (ໃຊ້ງົບ 800K).","en":"Year 1 = Mar 2027 – Feb 2028; month 0 = pre-opening (funded by the 800K)."},{"lo":"ເປີດ 30 ມື້/ເດືອນ; ເດືອນທີ 1 ໄດ້ລູກຄ້າ 60%, ເດືອນທີ 2 ໄດ້ 80% ຂອງເປົ້າໝາຍ.","en":"Open 30 days/month; month 1 at 60% and month 2 at 80% of target customers."},{"lo":"ຕົ້ນທຶນຜັນແປ 35% ຂອງຍອດຂາຍ; ການຕະຫຼາດ 2%.","en":"Variable cost 35% of sales; marketing 2%."},{"lo":"ປີທີ 2: ລູກຄ້າ +10%; ປີທີ 3: +5%. ລາຄາ ແລະ ຕົ້ນທຶນຄົງທີ່ +5%/ປີ. ຄ່າເຊົ່າຄົງທີ່ 3 ປີ (ເພດານໃນສັນຍາ).","en":"Year 2: customers +10%; Year 3: +5%. Prices and fixed costs +5%/year. Rent flat for 3 years (contract cap)."},{"lo":"ເງິນເດືອນ Ohh: ປີທີ 1 = 0; ປີທີ 2–3 = 10,000 ບາດ/ເດືອນ [ສົມມຸດ] ຖ້າ EBITDA ປີນັ້ນເກີນ 120,000.","en":"Ohh's salary: Year 1 = 0; Years 2–3 = THB 10,000/month [assumed] if that year's EBITDA exceeds 120,000."},{"lo":"ຄ່າເສື່ອມ 415,000 ບາດ ແບບເສັ້ນຊື່ 3 ປີ = 138,333 ບາດ/ປີ.","en":"Depreciation THB 415,000 straight-line over 3 years = THB 138,333/year."},{"lo":"ອາກອນ: ວິສາຫະກິດນ້ອຍອາດເສຍອາກອນເໝົາ ຫຼື ອາກອນກຳໄລ [ຕ້ອງຢືນຢັນກັບນັກບັນຊີ]; ຕົວເລກໃນແຜນເປັນກ່ອນອາກອນ.","en":"Tax: a small enterprise may pay lump-sum or profit tax [confirm with accountant]; figures are before tax."}]},{"type":"h","level":3,"text":{"lo":"4.2 ສາມກໍລະນີ","en":"4.2 Three scenarios"}},{"type":"table","columns":[{"lo":"ລາຍການ","en":"Item"},{"lo":"ຕ່ຳ","en":"Low"},{"lo":"ຫຼັກ","en":"Base"},{"lo":"ດີ","en":"Good"}],"rows":[[{"lo":"ຄ່າເຊົ່າ (USD/ເດືອນ)","en":"Rent (USD/month)"},"1,200","1,000","1,000"],[{"lo":"ບິນສະເລ່ຍ (ບາດ / ກີບ)","en":"Average ticket (THB / LAK)"},"95 / 65,000","100 / 68,000","105 / 71,000"],[{"lo":"ລູກຄ້າ/ມື້ (ສູງ / ກາງ / ຝົນ)","en":"Customers/day (high / mid / rainy)"},"105 / 75 / 50","120 / 85 / 55","150 / 110 / 70"],[{"lo":"ຈຸດຄຸ້ມທຶນ (ລູກຄ້າ/ມື້)","en":"Break-even (customers/day)"},"48","42","40"],[{"lo":"ຍອດຂາຍປີທີ 1","en":"Year 1 sales"},"2,493,750","2,967,000","3,950,100"],[{"lo":"EBITDA ປີທີ 1","en":"Year 1 EBITDA"},"532,995","909,849","1,529,202"],[{"lo":"ກຳໄລກ່ອນອາກອນ ປີທີ 1","en":"Year 1 profit before tax"},"394,662","771,515","1,390,868"],[{"lo":"ກຳໄລກ່ອນອາກອນ ປີທີ 3","en":"Year 3 profit before tax"},"749,059","1,227,278","2,059,997"],[{"lo":"ເງິນສົດຕິດລົບສູງສຸດໃນປີທີ 1","en":"Deepest cumulative cash dip in Year 1"},"-6,041","0","0"],[{"lo":"ຄືນທຶນ 800K","en":"Payback of THB 800K"},{"lo":"ເດືອນທີ 17 ຫຼັງເປີດ","en":"Month 17 after opening"},{"lo":"ເດືອນທີ 12 ຫຼັງເປີດ","en":"Month 12 after opening"},{"lo":"ເດືອນທີ 9 ຫຼັງເປີດ","en":"Month 9 after opening"}]],"total_row":false,"widths":[7,3.3,3.3,3.4],"align":["l","r","r","r"]},{"type":"p","text":{"lo":"ບິນສະເລ່ຍໃຊ້ລາຄາ MELO: ກໍລະນີຫຼັກ 100 ບາດ (ເທົ່າແບລນ MELO), ຕ່ຳ 95, ດີ 105. ກໍລະນີຕ່ຳ = ລູກຄ້າ ແລະ ຄ່າເຊົ່າຂອງກໍລະນີກາງໃນການວິເຄາະສະຖານທີ່. ກໍລະນີຫຼັກ = ຄ່າເຊົ່າ 1,000 USD, ບ່ອນນັ່ງ ~30 ຈາກອາຄານ 20 ມ. ຈຳນວນລູກຄ້າຍັງເທົ່າເກົ່າ (ບໍ່ໄດ້ຫຼຸດຍ້ອນລາຄາສູງຂຶ້ນ) — ທຸກຕົວເລກລູກຄ້າເປັນ [ສົມມຸດ] ຈົນກວ່າຈະນັບຄົນຍ່າງຜ່ານ ແລະ ທົດສອບລາຄາ.","en":"Average ticket uses MELO prices: base THB 100 (as in the MELO plan), low 95, good 105. Low = the customer numbers and rent of the site-fit analysis middle case. Base = rent USD 1,000, ~30 seats from the 20 m building. Customer numbers are unchanged (not lowered for the higher prices) — all are [assumed] until foot traffic is counted and prices are tested."}},{"type":"h","level":3,"text":{"lo":"4.3 ປີທີ 1 ລາຍເດືອນ (ກໍລະນີຫຼັກ, ບາດ)","en":"4.3 Year 1 by month (base case, THB)"}},{"type":"table","columns":[{"lo":"ເດືອນ","en":"Month"},{"lo":"ລະດູ","en":"Season"},{"lo":"ລູກຄ້າ/ມື້","en":"Cust./day"},{"lo":"ຍອດຂາຍ","en":"Sales"},{"lo":"ຕົ້ນທຶນຜັນແປ","en":"Variable"},{"lo":"ຄົງທີ່ + ເຊົ່າ","en":"Fixed + rent"},"EBITDA",{"lo":"ສະສົມ","en":"Cumulative"}],"rows":[[{"lo":"ມີ.ນ. 27","en":"Mar 27"},{"lo":"ກາງ","en":"Mid"},"51","153,000","56,610","80,280","16,110","16,110"],[{"lo":"ເມ.ສ. 27","en":"Apr 27"},{"lo":"ກາງ","en":"Mid"},"68","204,000","75,480","80,280","48,240","64,350"],[{"lo":"ພ.ພ. 27","en":"May 27"},{"lo":"ກາງ","en":"Mid"},"85","255,000","94,350","80,280","80,370","144,720"],[{"lo":"ມິ.ຖ. 27","en":"Jun 27"},{"lo":"ຝົນ","en":"Rainy"},"55","165,000","61,050","79,280","24,670","169,390"],[{"lo":"ກ.ລ. 27","en":"Jul 27"},{"lo":"ຝົນ","en":"Rainy"},"55","165,000","61,050","79,280","24,670","194,059"],[{"lo":"ສ.ຫ. 27","en":"Aug 27"},{"lo":"ຝົນ","en":"Rainy"},"55","165,000","61,050","79,280","24,670","218,729"],[{"lo":"ກ.ຍ. 27","en":"Sep 27"},{"lo":"ຝົນ","en":"Rainy"},"55","165,000","61,050","79,280","24,670","243,399"],[{"lo":"ຕ.ລ. 27","en":"Oct 27"},{"lo":"ກາງ","en":"Mid"},"85","255,000","94,350","80,280","80,370"," },{"type":"h","level":3,"text":{"lo":"5.2 ລາຄາ","en":"5.2 Pricing"}},{"type":"p","text":{"lo":"ຕັ້ງລາຄາເປັນກີບ ອີງຕາມລາຄາ MELO (ບາດ × 680): ກາເຟດຳ 41–48K, ກາເຟນົມ 48–58K, ບໍ່ແມ່ນກາເຟ 54–65K, Signature 65–78K ກີບ. ແພງກວ່າຄູ່ແຂ່ງໃກ້ຄຽງ ຈຶ່ງຕ້ອງໃຫ້ຄຸນຄ່າຊັດ (ເຄື່ອງດື່ມຄຣີມ, ຈອກງາມ, ໄວ). ເພີ່ມບິນດ້ວຍຊຸດ ເຄື່ອງດື່ມ + ຂະໜົມ (109–129K). ກວດລາຄາຄູ່ແຂ່ງ ແລະ ທົດສອບກັບລູກຄ້າໃນຊ່ວງເປີດທົດລອງ ກ່ອນພິມເມນູ.","en":"Price in kip based on MELO prices (THB × 680): black coffee 41–48K, milk coffee 48–58K, non-coffee 54–65K, signature 65–78K. This is above nearby competitors, so the value must be clear (cream drinks, beautiful cups, speed). Raise the ticket with drink + dessert sets (109–129K). Check competitor prices and test with customers during the soft opening before printing the menu."}},{"type":"h","level":3,"text":{"lo":"5.3 ການຕະຫຼາດ","en":"5.3 Marketing"}},{"type":"table","columns":[{"lo":"ຊ່ອງທາງ","en":"Channel"},{"lo":"ວຽກ","en":"Action"},{"lo":"ເປົ້າໝາຍ","en":"Target"}],"rows":[[{"lo":"Google Maps, TripAdvisor","en":"Google Maps, TripAdvisor"},{"lo":"ລົງທະບຽນກ່ອນເປີດ, ຂໍຣີວິວທີ່ບາ","en":"List before opening, ask for reviews at the bar"},{"lo":"100 ຣີວິວໃນ 6 ເດືອນ, ຄະແນນ ≥4.6","en":"100 reviews in 6 months, rating ≥4.6"}],[{"lo":"Instagram, TikTok","en":"Instagram, TikTok"},{"lo":"ຮູບຈອກ, ເຮືອນມໍລະດົກ, ຕັກບາດ (ຢ່າງເຄົາລົບ)","en":"Cups, heritage house, alms (respectfully)"},{"lo":"ໂພສ 3 ຄັ້ງ/ອາທິດ","en":"3 posts/week"}],[{"lo":"ເກສເຮົາສ ແລະ ໂຮງແຮມໃນ 500 ມ","en":"Guesthouses and hotels within 500 m"},{"lo":"ແຜ່ນພັບ ແລະ ສ່ວນຫຼຸດໃຫ້ແຂກ","en":"Flyers and guest discounts"},{"lo":"10 ຄູ່ຮ່ວມມື","en":"10 partners"}],[{"lo":"ໜ້າຮ້ານ","en":"Shopfront"},{"lo":"ປ້າຍໄມ້ຕາມລະບຽບ, ກະດານເມນູ","en":"Compliant wooden sign, menu board"},{"lo":"—","en":"—"}]],"total_row":false,"widths":[4.5,7,5.5]},{"type":"p","text":{"lo":"ງົບ: ເປີດຮ້ານ 20,000 ບາດ (ໃນງົບ 800K) + 2% ຂອງຍອດຂາຍທຸກເດືອນ.","en":"Budget: THB 20,000 for opening (within the 800K) + 2% of monthly sales."}},{"type":"h","level":3,"text":{"lo":"5.4 ແບລນ","en":"5.4 Brand"}},{"type":"p","text":{"lo":"ໃຊ້ຊື່ຊົ່ວຄາວ \"Cafe\" ໃນແຜນ. ຕັ້ງຊື່ ແລະ ອອກແບບໂລໂກ້, ຈອກ ແລະ ປ້າຍ (25,000 ບາດ) ໃຫ້ແລ້ວກ່ອນຍື່ນ ERC ແລະ ພິມປ້າຍ. ປ້າຍຕ້ອງມີໂຕໜັງສືລາວໃຫຍ່ກວ່າ, ບໍ່ມີກ່ອງໄຟ. ບໍ່ໃຊ້ຊື່ ຫຼື ສູດ MELO ຖ້າບໍ່ມີສັນຍາເປັນລາຍລັກອັກສອນ.","en":"Use \"Cafe\" as a working name. Finish naming and the logo, cup and sign design (THB 25,000) before filing the ERC and printing signs. Signs must show larger Lao text and no lightbox. Do not use the MELO name or recipes without a written agreement."}},{"type":"h","level":3,"text":{"lo":"5.5 ໂໝດລະດູຝົນ (ມິ.ຖ.–ກ.ຍ.)","en":"5.5 Rainy-season mode (Jun–Sep)"}},{"type":"bullets","items":[{"lo":"ເປີດ 7:00–17:00; ພະນັກງານພັກຜັດປ່ຽນກັນ, ບໍ່ປົດອອກ.","en":"Open 7:00–17:00; staff rotate days off, no layoffs."},{"lo":"ຫຼຸດສະຕັອກ ແລະ ເມນູທີ່ຂາຍຊ້າ; ເນັ້ນເຄື່ອງດື່ມຮ້ອນ ແລະ ລູກຄ້າທ້ອງຖິ່ນ.","en":"Cut stock and slow items; push hot drinks and local customers."},{"lo":"ຂໍຄ່າເຊົ່າຕາມລະດູ (ລະດູຝົນຕ່ຳກວ່າ) ໃນສັນຍາ.","en":"Ask for seasonal rent (lower in the rainy season) in the lease."}]},{"type":"h","level":3,"text":{"lo":"5.6 ການເຈລະຈາສັນຍາເຊົ່າ","en":"5.6 Lease negotiation"}},{"type":"p","text":{"lo":"ລາຍການຂໍຈາກເຈົ້າຂອງຢູ່ໃນພາກຜະໜວກ ຄ. ສິ່ງສຳຄັນທີ່ສຸດ: ຄ່າເຊົ່າ 1,000 USD, ລ່ວງໜ້າ 3 ເດືອນ, ເຈົ້າຂອງສ້ອມພື້ນຖານ, ຍົກເວັ້ນຄ່າເຊົ່າໄລຍະຂໍອະນຸຍາດ ແລະ ເງື່ອນໄຂຍົກເລີກຖ້າບໍ່ໄດ້ໃບອະນຸຍາດ.","en":"The owner request list is in Annex C. Most important: rent USD 1,000, 3 months prepaid, owner pays basic repairs, rent-free during permits, and a cancellation clause if permits are refused."}},{"type":"h","level":3,"text":{"lo":"5.7 ໂອກາດໃນອະນາຄົດ","en":"5.7 Future opportunity"}},{"type":"p","text":{"lo":"ສວນຫຼັງ (~8.5 ມ, ມີຕົ້ນຈຳປາ) ອາດເພີ່ມ 15–25 ບ່ອນນັ່ງໄດ້ ຖ້າໄດ້ຮັບອະນຸຍາດ. ບໍ່ຢູ່ໃນງົບ ແລະ ຕົວເລກຂອງແຜນນີ້; ຂໍສິດໃຊ້ສວນໄວ້ໃນສັນຍາເຊົ່າ.","en":"The rear garden (~8.5 m, frangipani tree) could add 15–25 seats if permitted. It is not in this plan's budget or figures; secure garden rights in the lease."}}]},{"title":{"lo":"ແຜນການດຳເນີນງານ","en":"Operations Plan"},"blocks":[{"type":"h","level":3,"text":{"lo":"6.1 ໄລຍະກ່ອນເປີດ (ເບື້ອງຕົ້ນ)","en":"6.1 Pre-opening phases (preliminary)"}},{"type":"callout","text":{"lo":"ຕາຕະລາງນີ້ເປັນແຜນເບື້ອງຕົ້ນ ບໍ່ລະບຸວັນທີແນ່ນອນ. ເວລາຂອງຝ່າຍມໍລະດົກຍັງບໍ່ຮູ້ ແລະ ຈະກຳນົດວັນທີຫຼັງພົບຝ່າຍມໍລະດົກ.","en":"This schedule is preliminary with no fixed dates. The heritage office's timing is unknown; dates will be set after meeting them."},"tone":"info"},{"type":"table","columns":[{"lo":"ໄລຍະ","en":"Phase"},{"lo":"ວຽກຫຼັກ","en":"Main work"},{"lo":"ໄລຍະເວລາໂດຍປະມານ","en":"Approx. duration"}],"rows":[[{"lo":"0. ສຳຫຼວດ ແລະ ກວດ","en":"0. Survey and verify"},{"lo":"ນັບຄົນຍ່າງຜ່ານ 3 ມື້, ເກັບລາຄາຄູ່ແຂ່ງ, ພົບຝ່າຍມໍລະດົກ, ວິສະວະກອນກວດອາຄານ, ວັດແທກ","en":"3-day foot count, competitor prices, heritage meeting, engineer inspection, measurements"},{"lo":"2–3 ອາທິດ","en":"2–3 weeks"}],[{"lo":"1. ຕັດສິນ ແລະ ເຊັນ","en":"1. Decide and sign"},{"lo":"ຄິດຕົວເລກໃໝ່, ກວດເງື່ອນໄຂ 7.2, ຕໍ່ລອງ ແລະ ເຊັນສັນຍາເຊົ່າ","en":"Recalculate, check 7.2 conditions, negotiate and sign the lease"},{"lo":"~2 ອາທິດ","en":"~2 weeks"}],[{"lo":"2. ອະນຸຍາດ ແລະ ແບລນ","en":"2. Permits and brand"},{"lo":"ແບບແຕ້ມ → ໜັງສືບໍ່ຄັດຄ້ານ + ໃບອະນຸຍາດປຸກສ້າງ; ຕັ້ງຊື່; ERC; ຈ້າງຜູ້ຈັດການ","en":"Drawings → no-objection + building permit; naming; ERC; hire manager"},{"lo":"4–8 ອາທິດ (ຂຶ້ນກັບຝ່າຍມໍລະດົກ)","en":"4–8 weeks (heritage-dependent)"}],[{"lo":"3. ຕົບແຕ່ງ ແລະ ຈ້າງ","en":"3. Fit-out and hiring"},{"lo":"ຕົບແຕ່ງ, ອຸປະກອນ, ໃບອະນຸຍາດຮ້ານອາຫານ (ຂະໜານ), ຈ້າງພະນັກງານ 3 ຄົນ","en":"Fit-out, equipment, restaurant licence (in parallel), hire 3 staff"},{"lo":"5–6 ອາທິດ","en":"5–6 weeks"}],[{"lo":"4. ຝຶກ ແລະ ເປີດທົດລອງ","en":"4. Training and soft opening"},{"lo":"ທີ່ປຶກສາຝຶກສູດ ແລະ SOP, ເປີດທົດລອງ 7–14 ມື້, ເປີດທາງການ","en":"Consultant trains recipes and SOP, 7–14 day soft opening, official opening"},{"lo":"2–3 ອາທິດ","en":"2–3 weeks"}]],"total_row":false,"widths":[4,9,4]},{"type":"p","text":{"lo":"ເປົ້າໝາຍເປີດມີນາ 2027. ຖ້າໃບອະນຸຍາດປຸກສ້າງຊ້າ ໃຫ້ເລື່ອນໄປເປີດກ່ອນບຸນປີໃໝ່ (ຕົ້ນເມສາ) ແລະ ບໍ່ເລີ່ມຕົບແຕ່ງກ່ອນໄດ້ໃບອະນຸຍາດ.","en":"Target opening March 2027. If the building permit is late, move the opening to before Pi Mai (early April) and do not start fit-out before the permit."}},{"type":"h","level":3,"text":{"lo":"6.2 ທີມງານ ແລະ ໜ້າທີ່","en":"6.2 Team and roles"}},{"type":"table","columns":[{"lo":"ຕຳແໜ່ງ","en":"Role"},{"lo":"ຈຳນວນ","en":"No."},{"lo":"ໜ້າທີ່","en":"Duties"},{"lo":"ເງິນເດືອນ (ກີບ) [ສົມມຸດ]","en":"Wage (LAK) [assumed]"}],"rows":[[{"lo":"ຜູ້ຈັດການ / ບາລິສຕ້າອາວຸໂສ","en":"Manager / senior barista"},"1",{"lo":"ດູແລຮ້ານ, ສະຕັອກ, ເງິນສົດ, ລາຍງານລາຍວັນ, ຄຸມ B2","en":"Runs shop, stock, cash, daily report, leads B2"},"6,000,000"],[{"lo":"ບາລິສຕ້າ","en":"Barista"},"2",{"lo":"B1 classic / B2 signature, ຄວາມສະອາດບາ","en":"B1 classic / B2 signature, bar cleanliness"},"3,500,000"],[{"lo":"ບໍລິການ / ແຄັດເຊຍ","en":"Service / cashier"},"1",{"lo":"POS, ຂະໜົມ, ໂຕະ, ຂໍຣີວິວ","en":"POS, pastries, tables, review requests"},"2,500,000"],[{"lo":"Ohh (ເຈົ້າຂອງ)","en":"Ohh (owner)"},"—",{"lo":"ຕັດສິນໃຈ, ກວດ dashboard, ລົງກວດເດືອນລະຄັ້ງ","en":"Decisions, dashboard review, monthly visit"},{"lo":"ປີທີ 1: 0","en":"Year 1: 0"}],[{"lo":"ທີ່ປຶກສາ","en":"Consultant"},{"lo":"ຄັ້ງຄາວ","en":"Ad hoc"},{"lo":"ສູດ, SOP, ຝຶກ, ກວດຄຸນນະພາບ","en":"Recipes, SOP, training, quality checks"},{"lo":"2,000 ບາດ/ເດືອນ","en":"THB 2,000/month"}]],"total_row":false,"widths":[4.5,1.5,7,4]},{"type":"h","level":3,"text":{"lo":"6.3 ກະວຽກ","en":"6.3 Shifts"}},{"type":"bullets","items":[{"lo":"ກະເຊົ້າ 6:00–14:00: ບາລິສຕ້າ 1 + ບໍລິການ + ຜູ້ຈັດການ (ຊ່ວງເລັ່ງຫຼັງຕັກບາດ).","en":"Morning 6:00–14:00: barista 1 + service + manager (post-alms rush)."},{"lo":"ກະບ່າຍ 10:30–18:30: ບາລິສຕ້າ 2 + ຜູ້ຈັດການ; ຊ້ອນກັນຊ່ວງ 10:30–14:00.","en":"Afternoon 10:30–18:30: barista 2 + manager; overlap 10:30–14:00."},{"lo":"ພັກ 1 ມື້/ອາທິດ ຜັດປ່ຽນກັນ; ລະດູຝົນ 7:00–17:00.","en":"One rotating day off per week; rainy season 7:00–17:00."}]},{"type":"h","level":3,"text":{"lo":"6.4 ຜູ້ສະໜອງ","en":"6.4 Suppliers"}},{"type":"bullets","items":[{"lo":"ເມັດກາເຟ: ໂຮງຄົ່ວລາວ (ພູພຽງບໍລະເວນ) [ຕ້ອງເລືອກ].","en":"Coffee: Lao roaster (Bolaven Plateau) [to choose]."},{"lo":"ຂະໜົມ: ຊື້ຈາກເບເກີຣີທ້ອງຖິ່ນ ທີ່ບໍ່ແມ່ນຄູ່ແຂ່ງໃກ້ຄຽງ [ຕ້ອງເລືອກ].","en":"Pastries: local bakery that is not a nearby competitor [to choose]."},{"lo":"ນົມ, ຄຣີມ, ນ້ຳກ້ອນ, ບັນຈຸພັນ: ຢ່າງໜ້ອຍ 2 ຜູ້ສະໜອງຕໍ່ລາຍການ.","en":"Milk, cream, ice, packaging: at least 2 suppliers per item."},{"lo":"ລົດສົ່ງເຄື່ອງຢຸດໄດ້ 10–15 ນາທີ ແລະ ນອກເວລາຕັກບາດ (ລະບຽບ 03/2026).","en":"Delivery vehicles may stop 10–15 minutes and outside alms hours (rule 03/2026)."}]},{"type":"h","level":3,"text":{"lo":"6.5 ການບໍລິຫານທາງໄກ","en":"6.5 Remote management"}},{"type":"bullets","items":[{"lo":"POS ທີ່ມີ dashboard ອອນລາຍ; ຜູ້ຈັດການສົ່ງລາຍງານທຸກມື້ (ຍອດຂາຍ, ເງິນສົດ, ສະຕັອກ, ບັນຫາ).","en":"POS with online dashboard; manager sends a daily report (sales, cash, stock, issues)."},{"lo":"Ohh ລົງກວດເດືອນລະຄັ້ງ; ທົບທວນທີ່ 30, 60, 90 ມື້ ແລະ ທຸກທ້າຍລະດູ.","en":"Ohh visits monthly; reviews at 30, 60, 90 days and at each season's end."},{"lo":"ແຜນລະອຽດຂອງ POS ແລະ dashboard ຈະເຮັດແຍກ ກ່ອນເປີດຮ້ານ.","en":"A detailed POS and dashboard plan will be prepared separately before opening."}]},{"type":"h","level":3,"text":{"lo":"6.6 KPI ຫຼັກ","en":"6.6 Key KPIs"}},{"type":"table","columns":["#","KPI",{"lo":"ເປົ້າໝາຍ","en":"Target"}],"rows":[["1",{"lo":"ລູກຄ້າ/ມື້","en":"Customers/day"},{"lo":"ສູງ 120, ກາງ 85, ຝົນ 55 (ຈຸດຄຸ້ມທຶນ ~42)","en":"High 120, mid 85, rainy 55 (break-even ~42)"}],["2",{"lo":"ບິນສະເລ່ຍ","en":"Average ticket"},{"lo":"≥68,000 ກີບ (100 ບາດ)","en":"≥LAK 68,000 (THB 100)"}],["3",{"lo":"ຍອດຂາຍ/ມື້","en":"Sales/day"},{"lo":"ສູງ ~12,000, ກາງ ~8,500, ຝົນ ~5,500 ບາດ","en":"High ~12,000, mid ~8,500, rainy ~5,500 THB"}],["4",{"lo":"ຕົ້ນທຶນວັດຖຸດິບ + ບັນຈຸພັນ","en":"Ingredients + packaging"},"≤35%"],["5",{"lo":"ຄ່າແຮງງານ","en":"Labour cost"},{"lo":"≤25% ຂອງຍອດຂາຍ","en":"≤25% of sales"}],["6",{"lo":"ເວລາຕໍ່ຈອກ","en":"Time per drink"} <script>
const D=JSON.parse(document.getElementById('plan-data').textContent);
let lang='lo';try{lang=localStorage.getItem('plan-lang')||'lo'}catch(e){}
const T=v=>v==null?'':(typeof v==='object'&&!Array.isArray(v))?(v[lang]??v.lo??v.en??''):String(v);

const MON={lo:['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'],en:['January','February','March','April','May','June','July','August','September','October','November','December']};
function fdate(s){const[y,m,d]=s.split('-').map(Number);return `${d} ${MON[lang][m-1]} ${y}`}
function table(b){const al=b.align||[];let h='<div class="wrap"><table class="t"><thead><tr>'+b.columns.map((c,i)=>`<th class="${al[i]||''}">${esc(c)}</th>`).join('')+'</tr></thead><tbody>';
 b.rows.forEach((r,ri)=>{const tot=b.total_row&&ri===b.rows.length-1;h+=`<tr class="${tot?'total':''}">`+r.map((c,i)=>`<td class="${al[i]||''}">${esc(c)}</td>`).join('')+'</tr>'});
 return h+'</tbody></table></div>'+(b.caption?`<p>${esc(b.caption)}</p>`:'')}
function list(items,tag){if(items.some(i=>Array.isArray(i)))return '<ol class="own">'+items.map(i=>`<li><b>${esc(i[0])}</b><span>${esc(i[1])}</span></li>`).join('')+'</ol>';return `<${tag}>`+items.map(i=>`<li><span></span><span>${esc(i)}</span></li>`.replace('<span></span>','')).join('')+`</${tag}>`}
function block(b){switch(b.type){
 case'p':return`<p>${esc(b.text)}</p>`;case'h':return`<h3>${esc(b.text)}</h3>`;
 case'bullets':return list(b.items,'ul');case'numbered':return list(b.items,'ol');
 case'table':return table(b);
 case'kv':return'<table class="kv"><tbody>'+b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')+'</tbody></table>';
 case'callout':case'formula':case'verdict':return`<div class="callout ${b.tone==='warn'?'warn':''}">${esc(b.text)}</div>`;

 case'pagebreak':return'<div class="annex"></div>';default:return''}}
function render(){document.documentElement.lang=lang;const m=D.meta;let h='<header class="cover"><div class="num">27</div>';
 h+=`<div class="meta-line"><span>${esc(m.code)} · ${esc(m.kind)}</span><span><span class="badge">${m.status==='final'?(lang==='lo'?'ສະບັບສົມບູນ':'Final'):(lang==='lo'?'ສະບັບຮ່າງ':'Draft')}</span> · ${fdate(m.date)}</span></div>`;
 h+=`<div class="kicker">${lang==='lo'?'ແຜນທຸລະກິດ':'Business Plan'} · Cafe</div><div class="rule"></div><h1>${esc(m.title)}</h1><p class="subtitle">${esc(m.subtitle)}</p>`;
